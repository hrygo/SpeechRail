name: tmp-fix-pr46-mypy2
on:
  push:
    branches: [feat/quality-voice-capabilities]
    paths: [.pr-bootstrap/FIX_MYPY2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quality-voice-capabilities
          fetch-depth: 0
      - name: Apply clone local narrowing and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/speechrail/backends/qwen3_tts.py')
          s=p.read_text()
          old='''        profile = get_voice_registry().get_profile(request.voice)\n        if profile.mode == "clone":\n            if self.clone is None:\n\n                async def unavailable() -> AsyncIterator[AudioChunk]:\n                    raise RuntimeError("voice_clone_base_model_unavailable")\n                    yield  # pragma: no cover\n\n                return unavailable()\n            selected: Qwen3TtsWorker = self.clone\n            other = self.primary\n        else:\n            selected = self.primary\n            other = self.clone\n'''
          new='''        profile = get_voice_registry().get_profile(request.voice)\n        clone_worker = self.clone\n        if profile.mode == "clone":\n            if clone_worker is None:\n\n                async def unavailable() -> AsyncIterator[AudioChunk]:\n                    raise RuntimeError("voice_clone_base_model_unavailable")\n                    yield  # pragma: no cover\n\n                return unavailable()\n            selected = clone_worker\n            other = self.primary\n        else:\n            selected = self.primary\n            other = clone_worker\n'''
          assert old in s, 'expected router block not found'
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .pr-bootstrap/FIX_MYPY2 .github/workflows/tmp-fix-pr46-mypy2.yml
          rmdir .pr-bootstrap 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tts): narrow optional clone worker before routing'
          git push origin HEAD:feat/quality-voice-capabilities
