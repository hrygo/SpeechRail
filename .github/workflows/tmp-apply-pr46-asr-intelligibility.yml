name: tmp-apply-pr46-asr-intelligibility
on:
  push:
    branches:
      - feat/quality-voice-capabilities
    paths:
      - .pr-bootstrap/pr46-asr-intelligibility-trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/quality-voice-capabilities
          fetch-depth: 0
      - name: Reassemble and apply reviewed ASR intelligibility patch
        run: |
          set -euxo pipefail
          cat .pr-bootstrap/pr46-asr-intelligibility.part.00 .pr-bootstrap/pr46-asr-intelligibility.part.01 .pr-bootstrap/pr46-asr-intelligibility.part.02 > /tmp/pr46-asr-intelligibility.patch.gz.b64
          base64 -d /tmp/pr46-asr-intelligibility.patch.gz.b64 | gzip -d > /tmp/pr46-asr-intelligibility.patch
          echo 'b898b1f2c617c7f5fdc5bfbf77ddb60c19a375c7be3681a5cea6ef3f4a4151c7  /tmp/pr46-asr-intelligibility.patch' | sha256sum -c -
          git apply --check /tmp/pr46-asr-intelligibility.patch
          git apply --index /tmp/pr46-asr-intelligibility.patch
          rm -f .pr-bootstrap/pr46-asr-intelligibility.part.00 .pr-bootstrap/pr46-asr-intelligibility.part.01 .pr-bootstrap/pr46-asr-intelligibility.part.02 .pr-bootstrap/pr46-asr-intelligibility-trigger .github/workflows/tmp-apply-pr46-asr-intelligibility.yml
          rmdir .pr-bootstrap 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(voice-quality): add ASR intelligibility gate'
          git push origin HEAD:feat/quality-voice-capabilities
      - name: Export Git history and pinned worktree for local validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr46-local
          cp /tmp/pr46-asr-intelligibility.patch /tmp/pr46-local/
          git rev-parse HEAD > /tmp/pr46-local/PR_HEAD
          git rev-parse HEAD^{tree} > /tmp/pr46-local/PR_TREE
          git rev-parse refs/remotes/origin/main > /tmp/pr46-local/MAIN_HEAD
          git bundle create /tmp/pr46-local/SpeechRail.bundle refs/heads/feat/quality-voice-capabilities refs/remotes/origin/main
          cd /tmp/pr46-local
          sha256sum SpeechRail.bundle pr46-asr-intelligibility.patch > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pr46-asr-local-validation
          path: /tmp/pr46-local/
          if-no-files-found: error
          retention-days: 7
