name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Type Check & Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg zsh

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            brew install ffmpeg
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --extra dev --extra mcp

      - name: Build wheel package
        run: uv build --no-sources --wheel

      - name: Code style check (Ruff)
        run: uv run ruff check src tests tools hatch_build.py

      - name: Static type check (Mypy)
        run: uv run mypy src

      - name: Run test suite with coverage gate (Pytest)
        run: uv run pytest --cov=src

  macos-app:
    name: macOS App Build & Tests
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run Swift package tests
        run: swift test --package-path macos/SpeechRailApp

      - name: Build and test unsigned App
        run: |
          xcodebuild \
            -project macos/SpeechRailApp/SpeechRailApp.xcodeproj \
            -scheme SpeechRailApp \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test \
            -testPlan SpeechRailApp

      - name: Lint macOS bundle metadata
        run: |
          plutil -lint macos/SpeechRailApp/Resources/LaunchAgents/com.speechrail.desktop.control.plist
          plutil -lint macos/SpeechRailApp/Entitlements/SpeechRailApp.entitlements

      - name: Check patch whitespace
        run: git diff --check
