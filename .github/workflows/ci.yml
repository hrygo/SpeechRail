name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  merge_group:
  workflow_call:
    inputs:
      package-runner:
        description: "Runner used for the release wheel package job"
        required: false
        type: string
        default: macos-26
      run-python:
        description: "Force the Python gate on/off. 'auto' classifies pull_request diffs and otherwise runs everything."
        required: false
        type: string
        default: "auto"
      run-swift:
        description: "Force the macOS App gate on/off. 'auto' classifies pull_request diffs and otherwise runs everything."
        required: false
        type: string
        default: "auto"

permissions:
  contents: read

concurrency:
  # A fixed prefix, not ${{ github.workflow }}: in a reusable-workflow call that
  # expression resolves to the CALLER's name, so this file would otherwise
  # declare the same group as the caller and cancel it (which skipped the
  # tag-triggered Release publish in v2.6.2). "ci-<ref>" stays unique to CI.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.13"

# Runner labels are pinned instead of tracking the `ubuntu-latest` alias:
# GitHub migrates that alias to Ubuntu 26 on 2026-10-19, which turns every
# ubuntu job into a deprecation notice and silently moves the gate OS under us.
# These jobs only need uv, a downloaded CPython and node, so the current LTS
# image is the stable choice.

jobs:
  change-scope:
    name: Change Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_python: ${{ steps.scope.outputs.run_python }}
      run_swift: ${{ steps.scope.outputs.run_swift }}
      scope: ${{ steps.scope.outputs.scope }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # `inputs` is null for push/pull_request, so the workflow_call
          # defaults do not apply on those events. Without the `|| 'auto'`
          # fallback the explicit branch below would see an empty string,
          # treat it as an override, and skip every gate.
          INPUT_RUN_PYTHON: ${{ inputs.run-python || 'auto' }}
          INPUT_RUN_SWIFT: ${{ inputs.run-swift || 'auto' }}
        run: |
          set -euo pipefail

          emit() {
            printf 'run_python=%s\nrun_swift=%s\nscope=%s\n' "$1" "$2" "$3" >> "$GITHUB_OUTPUT"
            {
              echo "### CI change scope: \`$3\`"
              echo
              echo "- Run Python gate: \`$1\`"
              echo "- Run Swift gate: \`$2\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # An explicit input wins. The release path uses it to skip the macOS
          # gate, because build-app already compiles the App from the same commit.
          # Second guard: an empty value can never mean "run nothing".
          [[ -z "$INPUT_RUN_PYTHON" ]] && INPUT_RUN_PYTHON=auto
          [[ -z "$INPUT_RUN_SWIFT" ]] && INPUT_RUN_SWIFT=auto

          if [[ "$INPUT_RUN_PYTHON" != "auto" || "$INPUT_RUN_SWIFT" != "auto" ]]; then
            run_python="$INPUT_RUN_PYTHON"; [[ "$run_python" == "auto" ]] && run_python=true
            run_swift="$INPUT_RUN_SWIFT";     [[ "$run_swift" == "auto" ]] && run_swift=true
            emit "$run_python" "$run_swift" "explicit"
            echo "- Reason: <code>workflow_call 显式指定</code>" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only pull requests are classified. main carries the branch
          # protection's required checks, and a conditional skip there would
          # change merge semantics rather than save work.
          if [[ "$EVENT_NAME" != "pull_request" || -z "$PR_BASE_SHA" ]]; then
            emit true true full
            echo "- Reason: <code>非 pull_request 事件，保持全量门禁</code>" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Run the classifier from the PR base ref: a pull request must not be
          # able to relax the gates by editing the classifier itself.
          classifier=scripts/ci_changed_scope.py
          if git cat-file -e "$PR_BASE_SHA:$classifier" 2>/dev/null; then
            git show "$PR_BASE_SHA:$classifier" > "$RUNNER_TEMP/ci_changed_scope.py"
            classifier="$RUNNER_TEMP/ci_changed_scope.py"
          else
            echo "::warning::base ref 尚无 ${classifier}，回退到全量门禁"
            emit true true full
            exit 0
          fi

          git diff --name-only -z "$PR_BASE_SHA...$PR_HEAD_SHA" \
            | python3 "$classifier" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # Do NOT pin UV_CACHE_DIR here: GitHub does not expand `~` in env
      # values, so uv would write into a literal `~` directory while
      # actions/cache resolves the path to $HOME/.cache/uv. The save step
      # then fails with "Path Validation Error ... no cache is being
      # saved" and the cache never exists. uv's own runner default is
      # already $HOME/.cache/uv, which is what the path below resolves to.
      #
      # setup-uv keys its cache on the uv.lock hash. A release only rewrites the
      # project's own version inside uv.lock, so that key changes on every
      # release and forces a full ~85MB re-download. restore-keys falls back to
      # the newest cache for this platform; uv is content-addressed, so it only
      # fetches what genuinely changed.
      # Pinned to v6: v4.3.0 still targets the Node.js 20 runtime that GitHub
      # deprecated, and v6 is the same action with unchanged inputs.
      - name: Restore uv download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_VERSION }}-

      - name: Set up Python 3.14.7
        run: uv python install 3.14.7

      - name: Install locked project dependencies
        run: uv sync --locked --extra dev --extra mcp

      - name: Code style check (Ruff)
        run: uv run ruff check src tests scripts hatch_build.py

      - name: Static type check (Mypy)
        run: uv run mypy src

      - name: Check release version consistency
        run: uv run python scripts/check_version_consistency.py

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@2.52.1 lint contracts/openapi.yaml

      - name: Check OpenAPI path parity
        run: uv run python scripts/check_openapi_contract.py

      - name: Check user guide contract coverage
        run: uv run python scripts/check_user_doc_contract.py

      - name: Check MCP tool surface parity
        run: uv run python scripts/check_mcp_tool_contract.py

      - name: Run explicit diarization contract regression tests
        run: uv run pytest --no-cov tests/test_diarization_extensions.py tests/test_diarization_sdk.py

      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$EVENT_BEFORE" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.run_python == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        python-version: ["3.14.7"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            brew install ffmpeg
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # Do NOT pin UV_CACHE_DIR here: GitHub does not expand `~` in env
      # values, so uv would write into a literal `~` directory while
      # actions/cache resolves the path to $HOME/.cache/uv. The save step
      # then fails with "Path Validation Error ... no cache is being
      # saved" and the cache never exists. uv's own runner default is
      # already $HOME/.cache/uv, which is what the path below resolves to.
      #
      # setup-uv keys its cache on the uv.lock hash. A release only rewrites the
      # project's own version inside uv.lock, so that key changes on every
      # release and forces a full ~85MB re-download. restore-keys falls back to
      # the newest cache for this platform; uv is content-addressed, so it only
      # fetches what genuinely changed.
      # Pinned to v6: v4.3.0 still targets the Node.js 20 runtime that GitHub
      # deprecated, and v6 is the same action with unchanged inputs.
      - name: Restore uv download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-${{ env.UV_VERSION }}-

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked project dependencies
        env:
          # The native CoreML worker is a release artifact input, not a test
          # input: nothing in the suite reads the binary this build hook
          # produces, and the wheel built below compiles it for real. Paying
          # ~3m of Swift here duplicated that work on the critical path. The
          # published wheel is still asserted to carry the worker in `package`.
          SPEECHRAIL_SKIP_NATIVE_WORKER_BUILD: "1"
        run: uv sync --locked --extra dev --extra mcp

      # The wheel build is this job's long pole (~3m of Swift release
      # compilation) and the suite reads nothing it produces, so build it in
      # the background and run the suite against the same checkout meanwhile.
      # Start, await and check happen in ONE step on purpose: each `run:` is a
      # fresh shell, so a PID recorded by an earlier step is not a child of the
      # shell that would `wait` on it.
      #
      # `--no-sync` is load-bearing. A bare `uv run` re-syncs the project, which
      # re-enters the build hook WITHOUT the opt-out and pays the full compile
      # again on the foreground path, silently restoring the serial cost.
      - name: Build wheel and run test suite
        run: |
          # No `set -e`: both the build and the suite must be awaited so a
          # failure in either is reported, and the wheel log is always shown.
          set -uo pipefail

          mkdir -p dist
          uv build --no-sources --wheel >"$RUNNER_TEMP/wheel-build.log" 2>&1 &
          build_pid=$!

          echo "--- pytest ---"
          uv run --no-sync pytest --cov=src
          pytest_status=$?

          if wait "$build_pid"; then build_status=0; else build_status=$?; fi

          echo "--- uv build ---"
          cat "$RUNNER_TEMP/wheel-build.log"
          if [[ "$build_status" -ne 0 ]]; then
            echo "::error::wheel 构建失败，退出码 $build_status"
            exit 1
          fi

          shopt -s nullglob
          wheels=(dist/speechrail-*.whl)
          test "${#wheels[@]}" -eq 1
          echo "SPEECHRAIL_WHEEL_PATH=${wheels[0]}" >> "$GITHUB_ENV"
          exit "$pytest_status"

      - name: Verify the wheel installs itself without a checkout (macOS)
        if: runner.os == 'macOS'
        run: |
          # The wheel carries the managed installer, so it must resolve and
          # describe the install subcommand with no source checkout present.
          shopt -s nullglob
          wheels=(dist/speechrail-*.whl)
          test "${#wheels[@]}" -eq 1
          uvx --python 3.14.7 --from "${wheels[0]}" speechrail install --help \
            | grep -F 'usage: speechrail install'

      - name: Upload tested wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speechrail-wheel-candidate
          path: dist/speechrail-*.whl
          if-no-files-found: error
          retention-days: 1

  macos-app:
    name: macOS App Build & Tests
    runs-on: macos-26
    timeout-minutes: 20
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.run_swift == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple toolchain and arm64 runner
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcodebuild -showsdks | grep -F 'macOS 26'

      - name: Run Swift package tests
        run: swift test --package-path macos/SpeechRailApp

      # Deliberately `build`, never `test`. The step above already runs every
      # test in macos/SpeechRailApp/SpeechRailMacControlTests through SwiftPM,
      # and that is the same source directory the Xcode test target compiles.
      # Running those XCTest and swift-testing suites a second time under
      # `xcodebuild test` reproduced a lost-wakeup hang: every test reported
      # passed, TeleprompterSessionLifecycleTests never reported suite
      # completion, the swift-testing run summary never printed, all threads
      # parked idle, and `** TEST SUCCEEDED **` never appeared — so the job sat
      # until `timeout-minutes` killed it. SwiftPM runs the same suites in
      # under a second, so this step's only remaining job is to prove the app
      # target still compiles and links in the Xcode project.
      #
      # UI tests are not run here either way: they take over the foreground and
      # require explicit per-run authorization.
      - name: Build unsigned App
        run: |
          # UI tests take over the foreground and require explicit per-run authorization.
          xcodebuild \
            -project macos/SpeechRailApp/SpeechRailApp.xcodeproj \
            -scheme SpeechRailApp \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build

      - name: Lint macOS bundle metadata
        run: |
          plutil -lint macos/SpeechRailApp/Resources/LaunchAgents/com.speechrail.desktop.control.plist
          plutil -lint macos/SpeechRailApp/Entitlements/SpeechRailApp.entitlements

  package:
    name: Package wheel artifact
    runs-on: ${{ inputs.package-runner || 'macos-26' }}
    timeout-minutes: 10
    needs: [change-scope, quality, test]
    if: ${{ needs.change-scope.outputs.run_python == 'true' }}

    steps:
      - name: Download tested wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: speechrail-wheel-candidate
          path: dist

      - name: Verify tested wheel artifact
        run: |
          shopt -s nullglob
          wheel_candidates=(dist/speechrail-*.whl)
          test "${#wheel_candidates[@]}" -eq 1
          wheel="${wheel_candidates[0]}"
          test -f "$wheel"
          unzip -t "$wheel"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            unzip -l "$wheel" | grep -F 'speechrail/_native/SpeechRailDiarizationWorker'
          fi

      - name: Prepare wheel artifact and checksum
        run: |
          mkdir -p release-artifact
          cp dist/*.whl release-artifact/
          (cd release-artifact && sha256sum ./*.whl > wheel.SHA256)

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speechrail-wheel
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7

  gate-summary:
    name: Gate Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [change-scope, quality, test, macos-app, package]
    if: ${{ always() }}

    steps:
      - name: Validate scope consistency and propagate failures
        env:
          SCOPE: ${{ needs.change-scope.outputs.scope }}
          RUN_PYTHON: ${{ needs.change-scope.outputs.run_python }}
          RUN_SWIFT: ${{ needs.change-scope.outputs.run_swift }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MACOS_RESULT: ${{ needs.macos-app.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          {
            echo "### CI 门禁结果"
            echo
            echo "| 门禁 | 结果 |"
            echo "|---|---|"
            echo "| scope | \`$SCOPE\` |"
            echo "| Quality Gates | $QUALITY_RESULT |"
            echo "| Test | $TEST_RESULT |"
            echo "| macOS App | $MACOS_RESULT |"
            echo "| Package | $PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Booleans must be exactly true/false. An empty or otherwise malformed
          # value silently compares unequal to 'true' downstream and would skip
          # a gate while the run still reported success.
          for pair in "run_python:$RUN_PYTHON" "run_swift:$RUN_SWIFT"; do
            name="${pair%%:*}"; value="${pair##*:}"
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "::error::$name 必须是 true 或 false，实际为 '$value'"
              exit 1
            fi
          done

          if [[ "$SCOPE" != "full" && "$SCOPE" != "meta" && "$SCOPE" != "python" \
             && "$SCOPE" != "swift" && "$SCOPE" != "explicit" ]]; then
            echo "::error::未知 scope '$SCOPE'"
            exit 1
          fi

          # A scope that disagrees with its own booleans means the classifier
          # output is untrustworthy; fail instead of reporting a green summary.
          if [[ "$SCOPE" == "explicit" && ( "$RUN_PYTHON" != "true" && "$RUN_SWIFT" != "true" ) ]]; then
            echo "::error::scope=explicit 但两个门禁都为 false"
            exit 1
          fi
          if [[ "$SCOPE" == "full" && ( "$RUN_PYTHON" != "true" || "$RUN_SWIFT" != "true" ) ]]; then
            echo "::error::scope=full 与门禁布尔不一致 (python=$RUN_PYTHON swift=$RUN_SWIFT)"
            exit 1
          fi
          if [[ "$SCOPE" == "meta" && ( "$RUN_PYTHON" != "false" || "$RUN_SWIFT" != "false" ) ]]; then
            echo "::error::scope=meta 与门禁布尔不一致 (python=$RUN_PYTHON swift=$RUN_SWIFT)"
            exit 1
          fi
          if [[ "$SCOPE" == "python" && ( "$RUN_PYTHON" != "true" || "$RUN_SWIFT" != "false" ) ]]; then
            echo "::error::scope=python 与门禁布尔不一致 (python=$RUN_PYTHON swift=$RUN_SWIFT)"
            exit 1
          fi
          if [[ "$SCOPE" == "swift" && ( "$RUN_PYTHON" != "false" || "$RUN_SWIFT" != "true" ) ]]; then
            echo "::error::scope=swift 与门禁布尔不一致 (python=$RUN_PYTHON swift=$RUN_SWIFT)"
            exit 1
          fi

          # A skipped gate is only legitimate when its scope says so; anything
          # else must not be reported as a green run.
          for entry in "quality:$QUALITY_RESULT" "test:$TEST_RESULT" \
                       "macos-app:$MACOS_RESULT" "package:$PACKAGE_RESULT"; do
            name="${entry%%:*}"; result="${entry##*:}"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::门禁 $name 结果为 $result"
              exit 1
            fi
            if [[ "$result" == "skipped" && "$SCOPE" == "full" ]]; then
              echo "::error::scope=full 但门禁 $name 被跳过"
              exit 1
            fi
          done
          echo "All selected CI gates passed; skipped gates were out of scope."
