name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.13"

jobs:
  verify-tag:
    name: Verify tag and project version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify release tag
        run: uv run --no-project --python 3.12 python scripts/verify_release_tag.py --tag "$GITHUB_REF_NAME"

  ci:
    name: Run reusable CI gates
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      package-runner: macos-26

  build-app:
    name: Build unsigned macOS DMG
    needs: verify-tag
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple toolchain and arm64 runner
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcodebuild -showsdks | grep -F 'macOS 26'

      - name: Build unsigned Release App
        env:
          APP_BUILD_DIRECTORY: ${{ runner.temp }}/speechrail-app-derived-data
        run: |
          xcodebuild \
            -project macos/SpeechRailApp/SpeechRailApp.xcodeproj \
            -scheme SpeechRailApp \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$APP_BUILD_DIRECTORY" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build

          app_path="$APP_BUILD_DIRECTORY/Build/Products/Release/SpeechRail.app"
          test -d "$app_path"
          test -x "$app_path/Contents/MacOS/SpeechRail"
          file "$app_path/Contents/MacOS/SpeechRail" | grep -F 'arm64'

      - name: Create and verify unsigned DMG
        env:
          APP_PATH: ${{ runner.temp }}/speechrail-app-derived-data/Build/Products/Release/SpeechRail.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Keep the asset name derived from the verified tag, never from a free-form input.
          dmg_path="$RUNNER_TEMP/SpeechRail-${version}-macOS-arm64.dmg"
          scripts/macos_app_create_dmg.sh \
            --app-path "$APP_PATH" \
            --version "$version" \
            --output-path "$dmg_path"
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "$dmg_path" "$RUNNER_TEMP/release-artifact/"
          (cd "$RUNNER_TEMP/release-artifact" && shasum -a 256 "$(basename "$dmg_path")" > dmg.SHA256)

      - name: Upload unsigned DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speechrail-macos-dmg
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    needs: [verify-tag, ci, build-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download wheel artifact from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: speechrail-wheel
          path: release-assets/wheel

      - name: Download macOS DMG artifact from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: speechrail-macos-dmg
          path: release-assets/dmg

      - name: Verify artifacts and create release checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          shopt -s nullglob
          wheel_candidates=(release-assets/wheel/speechrail-${version}-*.whl)
          dmg_candidates=(release-assets/dmg/SpeechRail-${version}-macOS-arm64.dmg)
          test "${#wheel_candidates[@]}" -eq 1
          test "${#dmg_candidates[@]}" -eq 1
          wheel="${wheel_candidates[0]}"
          dmg="${dmg_candidates[0]}"
          test -f "$wheel"
          test -f "$dmg"
          (cd release-assets/wheel && sha256sum -c wheel.SHA256)
          (cd release-assets/dmg && shasum -a 256 -c dmg.SHA256)
          mkdir -p release-assets/final
          cp "$wheel" "$dmg" release-assets/final/
          (cd release-assets/final && sha256sum ./*.whl ./*.dmg > SHA256SUMS)
          (cd release-assets/final && sha256sum -c SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_notes='## 发布文件说明

          - `speechrail-<version>-*.whl` — Python 服务包（CLI、FastAPI 应用、内置 CoreML 分人 worker），自带 `speechrail install` 安装入口：不需要 clone 仓库即可安装服务并准备模型。
          - `SpeechRail-<version>-macOS-arm64.dmg` — unsigned 的 macOS 控制面 App，最低 macOS 26.0。不加载模型、不启动服务、不监听 8201。
          - `SHA256SUMS` — 上述两个制品的 SHA-256 校验值。

          安装服务（在下载目录执行；`speechrail-*.whl` 需要是该目录里唯一的 wheel）：

          ```bash
          cd ~/Downloads
          shasum -a 256 -c SHA256SUMS
          uvx --python 3.12 --from ./speechrail-*.whl speechrail install --preset balanced --yes --enable
          ```

          升级用同一条命令，但必须先停掉旧实例：先用已安装 runtime 的
          `speechrail service stop --app-home "$HOME/Library/Application Support/SpeechRail"`，再执行上面的安装；
          省略 `--preset` 会沿用当前档位。

          服务与 App 是两个独立发布单元：先安装服务，再安装 App；只装 App 会显示「无法连接本机服务」。DMG 未签名也未公证，首次打开时 macOS 可能要求在「隐私与安全性」中点击「仍要打开」。

          安装顺序、wheel 的用途与限制、首次验证和常见问题见安装手册：'
          release_notes="${release_notes}
          https://github.com/${REPOSITORY}/blob/main/docs/users/installing-speechrail.md"
          assets=(release-assets/final/*.whl release-assets/final/*.dmg release-assets/final/SHA256SUMS)

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --title "SpeechRail $RELEASE_TAG" \
              --generate-notes \
              --notes "$release_notes" \
              --verify-tag \
              "${assets[@]}"
          fi
