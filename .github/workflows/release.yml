name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.13"

# Runner labels are pinned instead of tracking the `ubuntu-latest` alias:
# GitHub migrates that alias to Ubuntu 26 on 2026-10-19, which turns every
# ubuntu job into a deprecation notice and silently moves the release jobs
# onto a new OS under us. Neither job depends on Ubuntu specifics.

jobs:
  verify-tag:
    name: Verify tag and project version
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.14.7
        run: uv python install 3.14.7

      - name: Verify release tag
        run: uv run --no-project --python 3.14.7 python scripts/verify_release_tag.py --tag "$GITHUB_REF_NAME"

  ci:
    name: Run reusable CI gates
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      package-runner: macos-26
      # The tag is cut from a commit main already tested at full scope, and
      # build-app below compiles the same App from that same commit. Re-running
      # the Swift gate here only repeats ~7 minutes of xcodebuild on a second
      # runner with its own DerivedData.
      run-swift: "false"

  build-app:
    name: Build unsigned macOS DMG
    needs: verify-tag
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple toolchain and arm64 runner
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcodebuild -showsdks | grep -F 'macOS 26'

      - name: Build ad-hoc signed Release App
        env:
          APP_BUILD_DIRECTORY: ${{ runner.temp }}/speechrail-app-derived-data
        run: |
          # Keep code signing enabled: Release.xcconfig already selects the
          # ad-hoc identity (CODE_SIGN_IDENTITY=-), so no certificate is needed.
          # The App embeds com.speechrail.desktop.local-control.xpc, whose peer
          # policy pins the caller to `identifier "com.speechrail.desktop"`;
          # CODE_SIGNING_ALLOWED=NO would leave only the linker's ad-hoc
          # signature (identifier "SpeechRail", no resource seal) and every
          # control request would fail with errSecCSReqFailed.
          xcodebuild \
            -project macos/SpeechRailApp/SpeechRailApp.xcodeproj \
            -scheme SpeechRailApp \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$APP_BUILD_DIRECTORY" \
            ARCHS=arm64 \
            build

          app_path="$APP_BUILD_DIRECTORY/Build/Products/Release/SpeechRail.app"
          test -d "$app_path"
          test -x "$app_path/Contents/MacOS/SpeechRail"
          file "$app_path/Contents/MacOS/SpeechRail" | grep -F 'arm64'

      - name: Verify the local XPC control channel survives packaging
        env:
          APP_PATH: ${{ runner.temp }}/speechrail-app-derived-data/Build/Products/Release/SpeechRail.app
        run: scripts/macos_app_verify_local_xpc.sh "$APP_PATH"

      - name: Create and verify unsigned DMG
        env:
          APP_PATH: ${{ runner.temp }}/speechrail-app-derived-data/Build/Products/Release/SpeechRail.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Keep the asset name derived from the verified tag, never from a free-form input.
          dmg_path="$RUNNER_TEMP/SpeechRail-${version}-macOS-arm64.dmg"
          scripts/macos_app_create_dmg.sh \
            --app-path "$APP_PATH" \
            --version "$version" \
            --output-path "$dmg_path"
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "$dmg_path" "$RUNNER_TEMP/release-artifact/"
          (cd "$RUNNER_TEMP/release-artifact" && shasum -a 256 "$(basename "$dmg_path")" > dmg.SHA256)

      - name: Upload unsigned DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speechrail-macos-dmg
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    needs: [verify-tag, ci, build-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download wheel artifact from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: speechrail-wheel
          path: release-assets/wheel

      - name: Download macOS DMG artifact from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: speechrail-macos-dmg
          path: release-assets/dmg

      - name: Verify artifacts and create release checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          shopt -s nullglob
          wheel_candidates=(release-assets/wheel/speechrail-${version}-*.whl)
          dmg_candidates=(release-assets/dmg/SpeechRail-${version}-macOS-arm64.dmg)
          test "${#wheel_candidates[@]}" -eq 1
          test "${#dmg_candidates[@]}" -eq 1
          wheel="${wheel_candidates[0]}"
          dmg="${dmg_candidates[0]}"
          test -f "$wheel"
          test -f "$dmg"
          (cd release-assets/wheel && sha256sum -c wheel.SHA256)
          (cd release-assets/dmg && shasum -a 256 -c dmg.SHA256)
          mkdir -p release-assets/final
          cp "$wheel" "$dmg" release-assets/final/
          (cd release-assets/final && sha256sum ./*.whl ./*.dmg > SHA256SUMS)
          (cd release-assets/final && sha256sum -c SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          python3 scripts/build_release_notes.py \
            --version "${RELEASE_TAG#v}" \
            --repository "$REPOSITORY" \
            --changelog CHANGELOG.md \
            --output "$notes_file"
          assets=(release-assets/final/*.whl release-assets/final/*.dmg release-assets/final/SHA256SUMS)

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --title "SpeechRail $RELEASE_TAG" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${assets[@]}"
          fi
