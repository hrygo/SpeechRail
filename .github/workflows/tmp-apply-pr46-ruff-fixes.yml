name: tmp-apply-pr46-ruff-fixes
on:
  push:
    branches:
      - feat/quality-voice-capabilities
    paths:
      - .pr-bootstrap/pr46-ruff-fixes-trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quality-voice-capabilities
          fetch-depth: 0
      - name: Apply reviewed Ruff fixes
        run: |
          set -euxo pipefail
          cat .pr-bootstrap/pr46-ruff-fixes.part.00 .pr-bootstrap/pr46-ruff-fixes.part.01 > /tmp/pr46-ruff-fixes.patch.gz.b64
          base64 -d /tmp/pr46-ruff-fixes.patch.gz.b64 | gzip -d > /tmp/pr46-ruff-fixes.patch
          echo '4a9a4559eeec8ea954320e68ca353e1c17ff01d70ecbb951001864230f8e8e4d  /tmp/pr46-ruff-fixes.patch' | sha256sum -c -
          git apply --check /tmp/pr46-ruff-fixes.patch
          git apply --index /tmp/pr46-ruff-fixes.patch
          rm -f .pr-bootstrap/pr46-ruff-fixes.part.00 .pr-bootstrap/pr46-ruff-fixes.part.01 .pr-bootstrap/pr46-ruff-fixes-trigger .github/workflows/tmp-apply-pr46-ruff-fixes.yml
          rmdir .pr-bootstrap 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): satisfy quality gate lint checks'
          git push origin HEAD:feat/quality-voice-capabilities
