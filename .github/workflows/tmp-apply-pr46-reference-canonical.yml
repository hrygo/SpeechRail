name: tmp-apply-pr46-reference-canonical
on:
  push:
    branches:
      - feat/quality-voice-capabilities
    paths:
      - .pr-bootstrap/pr46-reference-canonical-trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quality-voice-capabilities
          fetch-depth: 0
      - name: Apply reviewed reference canonicalization patch
        run: |
          set -euxo pipefail
          base64 -d .pr-bootstrap/pr46-reference-canonical.part.00 | gzip -d > /tmp/pr46-reference-canonical.patch
          echo '6a2b656c5d0d853f66b2cec41cdf1f938a5e8de6ac498d7572632b3fdd13e8e7  /tmp/pr46-reference-canonical.patch' | sha256sum -c -
          git apply --check /tmp/pr46-reference-canonical.patch
          git apply --index /tmp/pr46-reference-canonical.patch
          rm -f .pr-bootstrap/pr46-reference-canonical.part.00 .pr-bootstrap/pr46-reference-canonical-trigger .github/workflows/tmp-apply-pr46-reference-canonical.yml
          rmdir .pr-bootstrap 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(voice-clone): canonicalize reference audio once'
          git push origin HEAD:feat/quality-voice-capabilities
