name: tmp-fix-pr46-mypy3
on:
  push:
    branches: [feat/quality-voice-capabilities]
    paths: [.pr-bootstrap/FIX_MYPY3]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quality-voice-capabilities
          fetch-depth: 0
      - name: Add explicit router variable types and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/speechrail/backends/qwen3_tts.py')
          s=p.read_text()
          old='''        profile = get_voice_registry().get_profile(request.voice)\n        clone_worker = self.clone\n        if profile.mode == "clone":\n'''
          new='''        profile = get_voice_registry().get_profile(request.voice)\n        clone_worker = self.clone\n        selected: Qwen3TtsWorker\n        other: Qwen3TtsWorker | None\n        if profile.mode == "clone":\n'''
          assert old in s, 'expected capability router prelude not found'
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .pr-bootstrap/FIX_MYPY3 .github/workflows/tmp-fix-pr46-mypy3.yml
          rmdir .pr-bootstrap 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tts): type capability router worker slots explicitly'
          git push origin HEAD:feat/quality-voice-capabilities
