name: tmp-apply-pr46-detail
on:
  push:
    branches:
      - feat/quality-voice-capabilities
    paths:
      - .pr-bootstrap/pr46-detail-trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quality-voice-capabilities
          fetch-depth: 0
      - name: Apply reviewed detail patch
        run: |
          set -euxo pipefail
          base64 -d .pr-bootstrap/pr46-detail.patch.gz.b64 | gzip -d > /tmp/pr46-detail.patch
          echo 'f7fed33b855b76718b1c78813666ad22beca5f812c8e44feb6d61c7464ecfb56  /tmp/pr46-detail.patch' | sha256sum -c -
          git apply --check /tmp/pr46-detail.patch
          git apply --index /tmp/pr46-detail.patch
          rm -f .pr-bootstrap/pr46-detail.patch.gz.b64
          rm -f .pr-bootstrap/pr46-detail-trigger
          rm -f .github/workflows/tmp-apply-pr46-detail.yml
          rmdir .pr-bootstrap 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tts): govern quality probes and expose warm capability'
          git push origin HEAD:feat/quality-voice-capabilities
