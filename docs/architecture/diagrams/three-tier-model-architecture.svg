<svg xmlns="http://www.w3.org/2000/svg"
     width="1920"
     height="1200"
     viewBox="0 0 1920 1200"
     role="img"
     aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">SpeechRail 三档规格、ASR/TTS 角色与资源边界</title>
  <desc id="diagram-desc">客户端通过共享 FastAPI Gateway 和 Plan Resolver 进入 fast、quality 或 reference 规格。ASR 与 TTS 可独立选档；每个 TTS 规格绑定 custom_voice 与 base 角色，只有 reference 另绑定仅用于设计作业的 voice_design。Alignment 与 Diarization 是显式 opt-in 的独立制品，不随规格继承。</desc>

  <defs>
    <style>
      <![CDATA[
        text {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
          fill: #15243a;
        }
        .canvas { fill: #f7f9fc; }
        .title { font-size: 34px; font-weight: 700; letter-spacing: -0.4px; }
        .subtitle { font-size: 17px; font-weight: 400; fill: #425b79; }
        .box-title { font-size: 20px; font-weight: 700; }
        .box-copy { font-size: 15px; font-weight: 500; fill: #3b5573; }
        .box-copy-small { font-size: 13px; font-weight: 400; fill: #4b647f; }
        .card-title { font-size: 26px; font-weight: 700; }
        .card-subtitle { font-size: 14px; font-weight: 600; }
        .section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.9px; fill: #4b647f; }
        .role-title { font-size: 15px; font-weight: 700; fill: #38516e; }
        .model-key { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
        .model-copy { font-size: 13px; font-weight: 500; fill: #425b79; }
        .note { font-size: 13px; font-weight: 500; fill: #4b647f; }
        .footer-title { font-size: 17px; font-weight: 700; }
        .footer-copy { font-size: 14px; font-weight: 500; fill: #38516e; }
        .flow { fill: none; stroke: #1f5fae; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .shared-line { fill: none; stroke: #6e87a5; stroke-width: 2; stroke-dasharray: 7 7; stroke-linecap: round; }
        .top-box { fill: #ffffff; stroke: #b9c8d9; stroke-width: 2; }
        .shared-box { fill: #edf4fc; stroke: #7ea6d1; stroke-width: 2; }
        .fast-card { fill: #ffffff; stroke: #3c9560; stroke-width: 2.5; }
        .fast-header { fill: #e7f6ec; }
        .fast-text { fill: #205d38; }
        .quality-card { fill: #ffffff; stroke: #c2851c; stroke-width: 2.5; }
        .quality-header { fill: #fff5d9; }
        .quality-text { fill: #704700; }
        .reference-card { fill: #ffffff; stroke: #7652bf; stroke-width: 2.5; }
        .reference-header { fill: #efe8ff; }
        .reference-text { fill: #4b2e8c; }
        .role-box { fill: #ffffff; stroke: #c5d2e0; stroke-width: 1.6; }
        .role-box-design { fill: #fbf9ff; stroke: #ab91df; stroke-width: 1.6; }
        .optional-box { fill: #f5f7fa; stroke: #c5d2e0; stroke-width: 1.6; stroke-dasharray: 7 5; }
        .lifecycle-box { fill: #fff8e8; stroke: #d19a35; stroke-width: 1.6; stroke-dasharray: 8 6; }
        .blue-text { fill: #1f5fae; }
        .orange-text { fill: #835600; }
      ]]>
    </style>
    <marker id="flow-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#1f5fae"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1920" height="1200"/>

  <text class="title" x="60" y="58">SpeechRail 三档规格、ASR/TTS 角色与资源边界</text>
  <text class="subtitle" x="60" y="88">ASR 与 TTS 独立选档 · custom_voice / base 每档绑定 · voice_design 仅 reference 且仅设计作业</text>

  <rect class="top-box" x="60" y="125" width="310" height="120" rx="16"/>
  <text class="box-title" x="85" y="164">Clients / Agents</text>
  <text class="box-copy" x="85" y="193">OpenAI SDK · Sona · 本地 App</text>
  <text class="box-copy-small" x="85" y="220">REST · current-only WebSocket</text>

  <rect class="top-box" x="465" y="125" width="420" height="120" rx="16"/>
  <text class="box-title" x="490" y="164">FastAPI Gateway</text>
  <text class="box-copy" x="490" y="193">request ID · bounded input · stable errors</text>
  <text class="box-copy-small" x="490" y="220">admission · server VAD · lifecycle</text>

  <rect class="top-box" x="980" y="125" width="420" height="120" rx="16"/>
  <text class="box-title" x="1005" y="164">Plan Resolver + Router</text>
  <text class="box-copy" x="1005" y="193">asr_spec / tts_spec / task kind / voice revision</text>
  <text class="box-copy-small" x="1005" y="220">显式角色路由 · 不按目录名或旧 preset 推断</text>

  <rect class="shared-box" x="1495" y="125" width="365" height="120" rx="16"/>
  <text class="box-title" x="1520" y="164">Task opt-in services</text>
  <text class="box-copy" x="1520" y="193">Alignment worker · Sortformer worker</text>
  <text class="box-copy-small" x="1520" y="220">仅任务显式开启 · 不随规格继承</text>

  <path class="flow" d="M370 185 H465" marker-end="url(#flow-arrow)"/>
  <path class="flow" d="M885 185 H980" marker-end="url(#flow-arrow)"/>
  <path class="shared-line" d="M1400 185 H1495"/>

  <path class="flow" d="M1045 245 V285 H330 V333" marker-end="url(#flow-arrow)"/>
  <path class="flow" d="M1190 245 V333" marker-end="url(#flow-arrow)"/>
  <path class="flow" d="M1335 245 V285 H1650 V333" marker-end="url(#flow-arrow)"/>

  <!-- fast -->
  <rect class="fast-card" x="60" y="345" width="540" height="545" rx="20"/>
  <path class="fast-header" d="M60 365 Q60 345 80 345 H580 Q600 345 600 365 V420 H60 Z"/>
  <text class="card-title fast-text" x="88" y="383">FAST</text>
  <text class="card-subtitle fast-text" x="88" y="408">轻快 · 8-bit ASR/TTS</text>

  <rect class="role-box" x="88" y="440" width="484" height="72" rx="12"/>
  <text class="role-title" x="108" y="466">ASR</text>
  <text class="model-key" x="108" y="492">asr-0.6b-q8</text>
  <text class="model-copy" x="340" y="492">单共享 ASR owner</text>

  <rect class="role-box" x="88" y="530" width="484" height="72" rx="12"/>
  <text class="role-title" x="108" y="556">TTS custom_voice</text>
  <text class="model-key" x="108" y="582">tts-0.6b-custom-q8</text>
  <text class="model-copy" x="365" y="582">系统声音</text>

  <rect class="role-box" x="88" y="620" width="484" height="72" rx="12"/>
  <text class="role-title" x="108" y="646">TTS base</text>
  <text class="model-key" x="108" y="672">tts-0.6b-base-q8</text>
  <text class="model-copy" x="365" y="672">参考克隆</text>

  <rect class="optional-box" x="88" y="710" width="484" height="145" rx="12"/>
  <text class="section-label" x="108" y="738">TASK OPT-IN</text>
  <text class="model-copy" x="108" y="765">aligner：显式点名 aligner-q8</text>
  <text class="model-copy" x="108" y="790">Diarization：Sortformer + aligner 都就绪才声明</text>
  <text class="note" x="108" y="825">词级时间戳来自 ASR 原生输出，不依赖 aligner</text>

  <!-- quality -->
  <rect class="quality-card" x="660" y="345" width="540" height="545" rx="20"/>
  <path class="quality-header" d="M660 365 Q660 345 680 345 H1180 Q1200 345 1200 365 V420 H660 Z"/>
  <text class="card-title quality-text" x="688" y="383">QUALITY</text>
  <text class="card-subtitle quality-text" x="688" y="408">品质 · 1.7B 8-bit ASR/TTS</text>

  <rect class="role-box" x="688" y="440" width="484" height="72" rx="12"/>
  <text class="role-title" x="708" y="466">ASR</text>
  <text class="model-key" x="708" y="492">asr-1.7b-q8</text>
  <text class="model-copy" x="940" y="492">单共享 ASR owner</text>

  <rect class="role-box" x="688" y="530" width="484" height="72" rx="12"/>
  <text class="role-title" x="708" y="556">TTS custom_voice</text>
  <text class="model-key" x="708" y="582">tts-1.7b-custom-q8</text>
  <text class="model-copy" x="965" y="582">系统声音</text>

  <rect class="role-box" x="688" y="620" width="484" height="72" rx="12"/>
  <text class="role-title" x="708" y="646">TTS base</text>
  <text class="model-key" x="708" y="672">tts-1.7b-base-q8</text>
  <text class="model-copy" x="965" y="672">参考克隆</text>

  <rect class="optional-box" x="688" y="710" width="484" height="145" rx="12"/>
  <text class="section-label" x="708" y="738">TASK OPT-IN</text>
  <text class="model-copy" x="708" y="765">aligner：显式点名 aligner-bf16</text>
  <text class="model-copy" x="708" y="790">Diarization：Sortformer + aligner 都就绪才声明</text>
  <text class="note" x="708" y="825">不继承 reference 的 VoiceDesign</text>

  <!-- reference -->
  <rect class="reference-card" x="1260" y="345" width="600" height="545" rx="20"/>
  <path class="reference-header" d="M1260 365 Q1260 345 1280 345 H1840 Q1860 345 1860 365 V420 H1260 Z"/>
  <text class="card-title reference-text" x="1288" y="383">REFERENCE</text>
  <text class="card-subtitle reference-text" x="1288" y="408">参考精度 · bf16 · 继承同族 8-bit 门禁证据</text>

  <rect class="role-box" x="1288" y="440" width="544" height="72" rx="12"/>
  <text class="role-title" x="1308" y="466">ASR</text>
  <text class="model-key" x="1308" y="492">asr-1.7b-bf16</text>
  <text class="model-copy" x="1545" y="492">单共享 ASR owner</text>

  <rect class="role-box" x="1288" y="530" width="260" height="72" rx="12"/>
  <text class="role-title" x="1308" y="556">TTS custom_voice</text>
  <text class="model-key" x="1308" y="582">tts-1.7b-custom-bf16</text>

  <rect class="role-box" x="1572" y="530" width="260" height="72" rx="12"/>
  <text class="role-title" x="1592" y="556">TTS base</text>
  <text class="model-key" x="1592" y="582">tts-1.7b-base-bf16</text>

  <rect class="role-box-design" x="1288" y="620" width="544" height="72" rx="12"/>
  <text class="role-title" x="1308" y="646">TTS voice_design · 仅设计作业</text>
  <text class="model-key" x="1308" y="672">tts-1.7b-design-bf16</text>
  <text class="model-copy" x="1585" y="672">普通 synthesize 拒绝 Design</text>

  <rect class="optional-box" x="1288" y="710" width="544" height="145" rx="12"/>
  <text class="section-label" x="1308" y="738">TASK OPT-IN</text>
  <text class="model-copy" x="1308" y="765">aligner：显式点名 aligner-bf16</text>
  <text class="model-copy" x="1308" y="790">Diarization：与 fast/quality 同为任务 opt-in</text>
  <text class="note" x="1308" y="825">bf16 未在本机逐项复测，不导出质量排名</text>

  <!-- shared boundary -->
  <rect class="shared-box" x="60" y="925" width="1800" height="150" rx="18"/>
  <text class="footer-title blue-text" x="88" y="960">Resource Governor · shared runtime boundary</text>
  <text class="footer-copy" x="88" y="990">ASR∥TTS 仅在声明峰值与物理内存预算允许时重叠；TTS 不同角色 lane 可并发，同一 lane 由 worker lock 串行。</text>
  <text class="footer-copy" x="88" y="1017">一个 SpeechRail 服务、一个 ASGI worker、一个 ASR owner；不因并发复制进程。请求路径不下载模型、不读取远程音频 URL。</text>
  <text class="footer-copy" x="88" y="1044">Alignment 与 Diarization 只在任务 opt-in 且制品就绪时启动独立 worker；未供给时对应能力不对外声明。</text>

  <rect class="lifecycle-box" x="1200" y="950" width="625" height="95" rx="13"/>
  <text class="footer-title orange-text" x="1225" y="980">Capability group lifecycle</text>
  <text class="footer-copy" x="1225" y="1008">按请求懒加载角色 → 可驻留的不同 lane 并发 → 空闲冷却</text>
  <text class="footer-copy" x="1225" y="1033">→ trim/close group → 下一请求只恢复需要的角色</text>
</svg>
