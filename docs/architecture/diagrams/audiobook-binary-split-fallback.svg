<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" width="1160" height="590" role="img" aria-labelledby="split-title split-desc">
  <title id="split-title">SpeechRail 递归二分重试与跨窗说话人状态接力拓扑</title>
  <desc id="split-desc">当大模型在单窗因情节复杂、Token 截断或超时失败时，触发 splitOrFailAnnotation 递归二分拆分；Left 成功后提取末尾说话人状态，注入 Right 的前置上下文，完成无缝接力。</desc>

  <defs>
    <style>
      <![CDATA[
        text {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
          -webkit-font-smoothing: antialiased;
        }
        .canvas-bg { fill: #f8f9fa; }
        
        .card-root { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.6; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.04)); rx: 10px; }
        .card-left { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.6; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.04)); rx: 10px; }
        .card-right { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.04)); rx: 10px; }
        .card-handoff { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 4 3; rx: 8px; }
        .card-bottom { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.5; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.04)); rx: 10px; }
        
        .flow-line { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .handoff-line { fill: none; stroke: #d97706; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 4; }
        
        .badge-err { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1; rx: 4px; }
        .badge-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 4px; }
        .badge-info { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; rx: 4px; }
        .badge-warn { fill: #fef3c7; stroke: #b45309; stroke-width: 1; rx: 4px; }
        
        .main-title { font-size: 20px; font-weight: 700; fill: #111827; }
        .main-subtitle { font-size: 13px; font-weight: 400; fill: #4b5563; }
        
        .card-title { font-size: 13.5px; font-weight: 700; }
        .bullet-text { font-size: 11.5px; font-weight: 400; }
        
        .mono-code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
        .branch-label { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
      ]]>
    </style>

    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect class="canvas-bg" width="1160" height="590" rx="12"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text class="main-title" x="0" y="0">递归二分重试与跨窗说话人状态接力拓扑</text>
    <text class="main-subtitle" x="0" y="22">规避输出截断与超时 · 动态重新生成短索引 1...K · Left 解析说话人无缝接力 Right 上下文</text>
  </g>

  <!-- Step 1: Root Window Failure (Centered: x=330, width=500, height=92) -->
  <g transform="translate(330, 72)">
    <rect class="card-root" x="0" y="0" width="500" height="92" rx="10"/>
    <rect class="badge-err" x="16" y="14" width="85" height="20"/>
    <text x="24" y="28" font-size="10" font-weight="700" fill="#be123c">CALL FAILED</text>
    <text x="110" y="28" font-size="11" font-weight="600" fill="#e11d48">输出 Token 截断 (outputTruncated) / 超时 / 格式异常</text>
    <text x="16" y="54" font-size="14.5" font-weight="700" fill="#881337">原始根窗口 Root Window (4,000 字 / 256 Atoms)</text>
    <text x="16" y="74" font-size="11" fill="#9f1239">触发 splitOrFailAnnotation 保护机制（硬预算：单根窗最多允许 4 次调用）</text>
  </g>

  <!-- Flow down to Left and Right split (Branching from 580, 164) -->
  <!-- Left branch -->
  <path class="flow-line" d="M 580 164 V 188 H 250 V 212" marker-end="url(#arrow-gray)"/>
  <text class="branch-label" x="390" y="182">二分前半段 Left (50%)</text>

  <!-- Right branch -->
  <path class="flow-line" d="M 580 164 V 188 H 910 V 212" marker-end="url(#arrow-gray)"/>
  <text class="branch-label" x="770" y="182">二分后半段 Right (50%)</text>

  <!-- Left Window Block (x=40, width=420, height=200) -->
  <g transform="translate(40, 218)">
    <rect class="card-left" x="0" y="0" width="420" height="200" rx="10"/>
    <rect class="badge-ok" x="16" y="14" width="100" height="20"/>
    <text x="24" y="28" font-size="10" font-weight="700" fill="#15803d">LEFT WINDOW</text>
    <text x="124" y="28" font-size="11" font-weight="600" fill="#047857">Primary 约 2,000 字 · 重新编号 1...K</text>

    <text class="card-title" x="16" y="58" fill="#064e3b">执行 Left 标注：executeAnnotationWithSplitFallback</text>
    <text class="bullet-text" x="16" y="80" fill="#047857">• leadingContext：继承原 Window 的 leadingItems</text>
    <text class="bullet-text" x="16" y="98" fill="#047857">• trailingContext：取 Right 的前 2 项作为只读预读</text>
    <text class="bullet-text" x="16" y="116" fill="#047857">• 成功返回：得到 Left 完整段落标注结果 leftAnns</text>

    <!-- Success tag -->
    <rect x="16" y="142" width="388" height="36" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="34" cy="160" r="5" fill="#10b981"/>
    <text x="48" y="164" font-size="11.5" font-weight="700" fill="#065f46">调用成功！解析出末尾对白发声角色：祥林嫂</text>
  </g>

  <!-- Middle Handoff Box: Sliding Speaker State Transfer (x=480, width=200, height=148) -->
  <g transform="translate(480, 244)">
    <rect class="card-handoff" x="0" y="0" width="200" height="148" rx="8"/>
    <rect class="badge-warn" x="14" y="12" width="120" height="18"/>
    <text x="20" y="25" font-size="9" font-weight="700" fill="#92400e">SPEAKER HANDOFF</text>
    
    <text x="14" y="50" font-size="12" font-weight="700" fill="#78350f">跨窗对话状态接力</text>
    <text x="14" y="70" font-size="10.5" fill="#92400e">从 Left 标注末尾提取：</text>
    
    <rect x="14" y="78" width="172" height="34" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text class="mono-code" x="20" y="93" fill="#b45309">resolvedSpeakerName</text>
    <text class="mono-code" x="20" y="106" fill="#78350f">= "祥林嫂"</text>
    
    <text x="14" y="132" font-size="10.5" font-weight="600" fill="#b45309">➔ 注入 Right.leadingContext</text>
  </g>

  <!-- Handoff Connectors -->
  <!-- From Left to Handoff (460 to 480) -->
  <path class="handoff-line" d="M 460 318 L 478 318" marker-end="url(#arrow-amber)"/>
  <!-- From Handoff to Right (680 to 700) -->
  <path class="handoff-line" d="M 680 318 L 698 318" marker-end="url(#arrow-amber)"/>

  <!-- Right Window Block (x=700, width=420, height=200) -->
  <g transform="translate(700, 218)">
    <rect class="card-right" x="0" y="0" width="420" height="200" rx="10"/>
    <rect class="badge-info" x="16" y="14" width="105" height="20"/>
    <text x="24" y="28" font-size="10" font-weight="700" fill="#1d4ed8">RIGHT WINDOW</text>
    <text x="130" y="28" font-size="11" font-weight="600" fill="#1e40af">Primary 约 2,000 字 · 重新编号 1...M</text>

    <text class="card-title" x="16" y="58" fill="#1e3a8a">执行 Right 标注（带着已接力说话人身份）</text>
    <text class="bullet-text" x="16" y="80" fill="#1e40af">• leadingContext：取 Left 末尾 2 项，并注入 speaker: "祥林嫂"</text>
    <text class="bullet-text" x="16" y="98" fill="#1e40af">• trailingContext：继承原 Window 的 trailingItems</text>
    <text class="bullet-text" x="16" y="116" fill="#1e40af">• 连续性保障：大模型获知前文发言人，精准识别接话人</text>

    <!-- Success tag -->
    <rect x="16" y="142" width="388" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <circle cx="34" cy="160" r="5" fill="#2563eb"/>
    <text x="48" y="164" font-size="11.5" font-weight="700" fill="#1e40af">调用成功！准确识别接话角色：卫老婆子</text>
  </g>

  <!-- Combine Result Flow -->
  <path class="flow-line" d="M 250 418 V 446 H 550 V 472" marker-end="url(#arrow-blue)"/>
  <path class="flow-line" d="M 910 418 V 446 H 610 V 472" marker-end="url(#arrow-blue)"/>

  <!-- Synthesis & Persist Box (Centered: x=160, width=840, height=72) -->
  <g transform="translate(160, 478)">
    <rect class="card-bottom" x="0" y="0" width="840" height="72" rx="10"/>
    <rect x="8" y="10" width="4" height="52" rx="2" fill="#0284c7"/>

    <g transform="translate(24, 24)">
      <text font-size="14" font-weight="700" fill="#0f172a">合并二分结果并校验覆盖：leftAnns + rightAnns</text>
      <text class="mono-code" x="0" y="24" fill="#334155">validateWindowAnnotationsCoverPrimaryAtoms 验证 100% 覆盖 ➔ 事务写入 SQLite 检查点</text>
    </g>

    <!-- Quota safety badge -->
    <g transform="translate(670, 20)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="16" cy="16" r="4.5" fill="#475569"/>
      <text x="28" y="20.5" font-size="11" font-weight="600" fill="#334155">配额安全: ≤4 次重试</text>
    </g>
  </g>
</svg>
