<svg xmlns="http://www.w3.org/2000/svg"
     width="2000"
     height="1280"
     viewBox="0 0 2000 1280"
     role="img"
     aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">SpeechRail 四档模型与 capability 关系图</title>
  <desc id="diagram-desc">Light、Balanced、Quality 与候选 Extreme 通过同一 API 和 profile capability router 运行。Light 与 Balanced 使用 CustomVoice；Quality 使用 8-bit ASR、VoiceDesign 和 Base，aligner 为 bf16；Extreme 使用 bf16 ASR、VoiceDesign、Base 和 aligner。Balanced、Quality、Extreme 配置分人能力。Quality 与 Extreme 可提供 VoiceDesign 和 Base 两个独立 TTS capability worker。Extreme 的质量、资源与延迟尚未验证，图中不表达质量排名或硬件门槛。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #17253a; }
      .canvas { fill: #f7f9fc; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52657d; }
      .top { fill: #fff; stroke: #b9c8d9; stroke-width: 2; }
      .shared { fill: #edf4fc; stroke: #7ea6d1; stroke-width: 2; }
      .box-title { font-size: 20px; font-weight: 700; }
      .box-copy { font-size: 15px; fill: #405a78; }
      .card { fill: #fff; stroke-width: 2.5; }
      .header { stroke: none; }
      .card-title { font-size: 24px; font-weight: 700; }
      .tag { font-size: 14px; font-weight: 600; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: .6px; fill: #536881; }
      .model { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; }
      .copy { font-size: 15px; fill: #405a78; }
      .small { font-size: 13px; fill: #52657d; }
      .rule { stroke: #d7e0ea; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #1f5fae; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .light { stroke: #3c9560; }
      .light-fill { fill: #e7f6ec; }
      .light-text { fill: #205d38; }
      .balanced { stroke: #c2851c; }
      .balanced-fill { fill: #fff5d9; }
      .balanced-text { fill: #704700; }
      .quality { stroke: #7652bf; }
      .quality-fill { fill: #efe8ff; }
      .quality-text { fill: #4b2e8c; }
      .extreme { stroke: #bd5261; }
      .extreme-fill { fill: #ffedf0; }
      .extreme-text { fill: #812d3a; }
      .candidate { fill: #fff8e8; stroke: #d19a35; stroke-width: 1.5; }
      .candidate-copy { font-size: 13px; font-weight: 600; fill: #835600; }
      .footer-title { font-size: 17px; font-weight: 700; fill: #1f5fae; }
      .footer-copy { font-size: 14px; fill: #38516e; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f5fae"/>
    </marker>
  </defs>

  <rect class="canvas" width="2000" height="1280"/>
  <text class="title" x="60" y="60">SpeechRail 四档模型与 capability</text>
  <text class="subtitle" x="60" y="92">共享 API、worker 生命周期与资源准入 · profile 选择权重和已发布能力</text>

  <rect class="top" x="60" y="130" width="350" height="105" rx="16"/>
  <text class="box-title" x="85" y="169">Clients / Agents</text>
  <text class="box-copy" x="85" y="199">REST · Realtime · MCP proxy</text>

  <rect class="top" x="480" y="130" width="650" height="105" rx="16"/>
  <text class="box-title" x="505" y="169">SpeechRail API Gateway</text>
  <text class="box-copy" x="505" y="199">统一端点与错误契约 · 单服务、单 ASGI worker</text>

  <rect class="top" x="1200" y="130" width="740" height="105" rx="16"/>
  <text class="box-title" x="1225" y="169">Profile + capability router</text>
  <text class="box-copy" x="1225" y="199">按当前档位和 readiness 路由 · MCP 只报告当前能力，不切档</text>

  <path class="arrow" d="M410 182 H480" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1130 182 H1200" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1570 235 V270 H275 V300" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1570 270 H755 V300" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1570 270 H1235 V300" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1570 270 H1715 V300" marker-end="url(#arrowhead)"/>

  <!-- Light -->
  <rect class="card light" x="60" y="300" width="430" height="800" rx="18"/>
  <rect class="header light-fill" x="60" y="300" width="430" height="82" rx="18"/>
  <rect class="header light-fill" x="60" y="362" width="430" height="20"/>
  <text class="card-title light-text" x="85" y="340">LIGHT · 轻量</text>
  <text class="tag light-text" x="85" y="367">Embedded · existing q8 preset</text>
  <text class="section" x="85" y="425">ASR</text>
  <text class="model" x="85" y="453">asr-0.6b-q8</text>
  <text class="copy" x="85" y="480">Qwen3-ASR 0.6B · 8-bit</text>
  <line class="rule" x1="85" y1="505" x2="465" y2="505"/>
  <text class="section" x="85" y="540">DEFAULT TTS</text>
  <text class="model" x="85" y="569">tts-0.6b-custom-q8</text>
  <text class="copy" x="85" y="596">CustomVoice · 8-bit</text>
  <line class="rule" x1="85" y1="622" x2="465" y2="622"/>
  <text class="section" x="85" y="658">OPTIONAL CAPABILITIES</text>
  <text class="copy" x="85" y="690">Aligner: none · Diarization: unavailable</text>
  <text class="copy" x="85" y="720">VoiceDesign / Base: unavailable</text>
  <rect class="shared" x="85" y="780" width="380" height="120" rx="12"/>
  <text class="section" x="105" y="813">PUBLIC API</text>
  <text class="copy" x="105" y="843">ASR / TTS · timestamps</text>
  <text class="small" x="105" y="870">No aligner needed for word timestamps</text>
  <text class="small" x="85" y="965">Only advertises capabilities actually ready</text>

  <!-- Balanced -->
  <rect class="card balanced" x="540" y="300" width="430" height="800" rx="18"/>
  <rect class="header balanced-fill" x="540" y="300" width="430" height="82" rx="18"/>
  <rect class="header balanced-fill" x="540" y="362" width="430" height="20"/>
  <text class="card-title balanced-text" x="565" y="340">BALANCED · 均衡</text>
  <text class="tag balanced-text" x="565" y="367">Pro Workflow · existing q8 preset</text>
  <text class="section" x="565" y="425">ASR</text>
  <text class="model" x="565" y="453">asr-1.7b-q8</text>
  <text class="copy" x="565" y="480">Qwen3-ASR 1.7B · 8-bit</text>
  <line class="rule" x1="565" y1="505" x2="945" y2="505"/>
  <text class="section" x="565" y="540">DEFAULT TTS</text>
  <text class="model" x="565" y="569">tts-0.6b-custom-q8</text>
  <text class="copy" x="565" y="596">CustomVoice · 8-bit</text>
  <line class="rule" x1="565" y1="622" x2="945" y2="622"/>
  <text class="section" x="565" y="658">DIARIZATION PATH</text>
  <text class="model" x="565" y="690">aligner-q8</text>
  <text class="copy" x="565" y="720">+ FluidAudio CoreML Sortformer</text>
  <rect class="shared" x="565" y="780" width="380" height="120" rx="12"/>
  <text class="section" x="585" y="813">CAPABILITY</text>
  <text class="copy" x="585" y="843">Diarization: configured</text>
  <text class="copy" x="585" y="870">VoiceDesign / Base: unavailable</text>
  <text class="small" x="565" y="965">Aligner serves diarization, not ASR word timestamps</text>

  <!-- Quality -->
  <rect class="card quality" x="1020" y="300" width="430" height="800" rx="18"/>
  <rect class="header quality-fill" x="1020" y="300" width="430" height="82" rx="18"/>
  <rect class="header quality-fill" x="1020" y="362" width="430" height="20"/>
  <text class="card-title quality-text" x="1045" y="340">QUALITY · 精准</text>
  <text class="tag quality-text" x="1045" y="367">Studio · q8 speech models, bf16 aligner</text>
  <text class="section" x="1045" y="425">ASR</text>
  <text class="model" x="1045" y="453">asr-1.7b-q8</text>
  <text class="copy" x="1045" y="480">Qwen3-ASR 1.7B · 8-bit</text>
  <line class="rule" x1="1045" y1="505" x2="1425" y2="505"/>
  <text class="section" x="1045" y="540">TTS CAPABILITY WORKERS</text>
  <text class="model" x="1045" y="570">tts-1.7b-design-q8</text>
  <text class="copy" x="1045" y="596">VoiceDesign · 8-bit</text>
  <text class="model" x="1045" y="636">tts-1.7b-base-q8</text>
  <text class="copy" x="1045" y="662">Base clone · 8-bit</text>
  <line class="rule" x1="1045" y1="688" x2="1425" y2="688"/>
  <text class="section" x="1045" y="724">DIARIZATION PATH</text>
  <text class="model" x="1045" y="756">aligner-bf16 + CoreML</text>
  <text class="copy" x="1045" y="785">Separate worker lanes for VoiceDesign / Base</text>
  <rect class="shared" x="1045" y="830" width="380" height="100" rx="12"/>
  <text class="section" x="1065" y="863">CAPABILITY</text>
  <text class="copy" x="1065" y="893">VoiceDesign · Base clone · diarization</text>
  <text class="small" x="1045" y="982">Available only when current runtime reports ready</text>

  <!-- Extreme -->
  <rect class="card extreme" x="1500" y="300" width="430" height="800" rx="18"/>
  <rect class="header extreme-fill" x="1500" y="300" width="430" height="82" rx="18"/>
  <rect class="header extreme-fill" x="1500" y="362" width="430" height="20"/>
  <text class="card-title extreme-text" x="1525" y="340">EXTREME · 极致</text>
  <text class="tag extreme-text" x="1525" y="367">BF16 candidate · explicit selection only</text>
  <text class="section" x="1525" y="425">ASR</text>
  <text class="model" x="1525" y="453">asr-1.7b-bf16</text>
  <text class="copy" x="1525" y="480">Qwen3-ASR 1.7B · BF16</text>
  <line class="rule" x1="1525" y1="505" x2="1905" y2="505"/>
  <text class="section" x="1525" y="540">TTS CAPABILITY WORKERS</text>
  <text class="model" x="1525" y="570">tts-1.7b-design-bf16</text>
  <text class="copy" x="1525" y="596">VoiceDesign · BF16</text>
  <text class="model" x="1525" y="636">tts-1.7b-base-bf16</text>
  <text class="copy" x="1525" y="662">Base clone · BF16</text>
  <line class="rule" x1="1525" y1="688" x2="1905" y2="688"/>
  <text class="section" x="1525" y="724">DIARIZATION PATH</text>
  <text class="model" x="1525" y="756">aligner-bf16 + CoreML</text>
  <text class="copy" x="1525" y="785">Reuses the Quality aligner artifact</text>
  <rect class="candidate" x="1525" y="830" width="380" height="100" rx="12"/>
  <text class="candidate-copy" x="1545" y="863">Candidate only · quality unverified</text>
  <text class="candidate-copy" x="1545" y="891">Resource / latency evidence unverified</text>
  <text class="small" x="1525" y="982">BF16 precision does not establish quality ranking</text>

  <rect class="shared" x="60" y="1140" width="1870" height="95" rx="16"/>
  <text class="footer-title" x="90" y="1178">Shared runtime and resource boundary</text>
  <text class="footer-copy" x="90" y="1208">Single SpeechRail service / ASGI worker · governed ASR∥TTS overlap · MCP proxies current capabilities only · no automatic profile switching</text>
</svg>
