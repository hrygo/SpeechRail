[project]
name = "speechrail"
version = "3.7.1"
description = "Local-first shared speech recognition service with OpenAI-compatible APIs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "hrygo" }]
keywords = ["speech", "asr", "tts", "qwen3-asr", "qwen3-tts", "openai-compatible", "realtime", "mlx", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "websockets>=14",
    "onnxruntime==1.30.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/hrygo/SpeechRail"
Documentation = "https://github.com/hrygo/SpeechRail#readme"
Repository = "https://github.com/hrygo/SpeechRail"
Issues = "https://github.com/hrygo/SpeechRail/issues"
Changelog = "https://github.com/hrygo/SpeechRail/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "numpy>=1.26,<3.0",
    "mcp>=2.1,<3",
    "openai>=2.0,<4.0",
    "pyannote-metrics==4.1",
]
mcp = ["mcp>=2.1,<3"]

[project.scripts]
speechrail = "speechrail.__main__:main"
speechrail-mcp = "speechrail.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechrail"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/openapi.yaml" = "speechrail/assets/openapi.yaml"

[tool.hatch.build.hooks.custom]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "RUF", "PTH", "RET"]
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
# 本项目唯一发布目标是 Apple Silicon macOS。CI 的静态检查跑在 ubuntu runner 上，
# 而 mypy 的 platform 默认跟随宿主——不写这一行，`if sys.platform == "darwin"`
# 分支会被判为不可达而整个跳过分析，检查的正好是唯一不发布的平台。
platform = "darwin"
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "onnxruntime",
    "mlx",
    "mlx.*",
    "mlx_qwen3_asr",
    "mlx_qwen3_asr.*",
]
ignore_missing_imports = true
