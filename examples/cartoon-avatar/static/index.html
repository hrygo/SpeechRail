<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="使用 SpeechRail 音色驱动的本地卡通数字人播报示例"
    />
    <title>卡通数字人 · SpeechRail</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/app.mjs"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-panel" aria-labelledby="avatar-heading">
        <p class="eyebrow">SpeechRail 本地示例</p>
        <h1 id="avatar-heading">卡通数字人</h1>
        <p class="intro">
          选择一个角色和音色，让本地播报员把文字说出来。
        </p>

        <div class="avatar-stage">
          <div
            id="avatar"
            class="avatar-figure avatar-action-idle"
            data-action="idle"
            data-profile="midnight"
            data-hair="short"
            data-clothes="blazer"
            data-accessory="glasses"
            data-voice-id="uncle_fu"
            role="img"
            aria-labelledby="avatar-title avatar-description"
          >
            <span id="avatar-title" class="visually-hidden">原创几何风格卡通播报员</span>
            <span id="avatar-description" class="visually-hidden">
              一个可以切换外观和音色的半身卡通角色，会随播报状态做轻微动作。
            </span>
            <svg
              id="avatar-svg"
              class="avatar-svg"
              viewBox="0 0 360 500"
              aria-hidden="true"
              focusable="false"
            >
              <defs>
                <radialGradient id="avatar-shadow-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#18343a" stop-opacity="0.28" />
                  <stop offset="65%" stop-color="#18343a" stop-opacity="0.08" />
                  <stop offset="100%" stop-color="#18343a" stop-opacity="0" />
                </radialGradient>
                <linearGradient id="avatar-eye-grad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0f172a" />
                  <stop offset="60%" stop-color="var(--avatar-accent)" />
                  <stop offset="100%" stop-color="var(--avatar-hair-highlight)" />
                </linearGradient>
                <radialGradient id="avatar-blush-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="var(--avatar-blush, #fb7185)" stop-opacity="0.45" />
                  <stop offset="100%" stop-color="var(--avatar-blush, #fb7185)" stop-opacity="0" />
                </radialGradient>
              </defs>

              <ellipse class="avatar-shadow" cx="180" cy="474" rx="118" ry="14" fill="url(#avatar-shadow-grad)" />

              <!-- BODY GROUP (Breathing & Torso) -->
              <g id="avatar-body" class="avatar-body">
                <!-- Neck & Under-chin Shadow -->
                <path
                  class="avatar-neck"
                  fill="var(--avatar-skin)"
                  d="M162 232h36v82h-36z"
                />
                <path
                  class="avatar-neck-shadow"
                  fill="var(--avatar-skin-shadow)"
                  opacity="0.38"
                  d="M162 232c10 18 26 18 36 0v22c-10 14-26 14-36 0z"
                />

                <!-- Shoulders / Coat -->
                <path
                  class="avatar-shoulders"
                  fill="var(--avatar-clothes)"
                  d="M72 472c8-98 46-150 108-150s100 52 108 150z"
                />

                <!-- Shirt / Base Inner -->
                <path
                  class="avatar-shirt"
                  fill="var(--avatar-shirt)"
                  d="M148 322h64l28 150h-120z"
                />

                <!-- Blazer Variant -->
                <g id="avatar-collar-blazer" class="avatar-variant avatar-collar">
                  <path
                    fill="var(--avatar-clothes)"
                    d="M136 322l44 72 44-72 32 150h-36l-28-94-12 18-12-18-28 94h-36z"
                  />
                  <path
                    fill="var(--avatar-clothes-accent)"
                    d="M144 322l36 56 36-56 10 38-28 46-18-26-18 26-28-46z"
                  />
                  <polygon
                    points="180,334 186,348 180,390 174,348"
                    fill="var(--avatar-accent)"
                  />
                  <circle cx="180" cy="336" r="4.5" fill="var(--avatar-clothes-accent)" />
                </g>

                <!-- Hoodie Variant -->
                <g id="avatar-collar-hoodie" class="avatar-variant avatar-collar">
                  <path
                    fill="var(--avatar-clothes-accent)"
                    d="M130 324c14 26 34 38 50 38s36-12 50-38c16 8 36 52 42 148H88c6-96 26-140 42-148z"
                  />
                  <path
                    fill="var(--avatar-clothes)"
                    d="M138 324c12 20 27 30 42 30s30-10 42-30l16 70c-18 24-40 32-58 32s-40-8-58-32z"
                  />
                  <path
                    d="M166 354v44M194 354v40"
                    stroke="var(--avatar-shirt)"
                    stroke-width="3.5"
                    stroke-linecap="round"
                  />
                  <circle cx="166" cy="400" r="3" fill="var(--avatar-accent)" />
                  <circle cx="194" cy="396" r="3" fill="var(--avatar-accent)" />
                </g>

                <!-- Sweater Variant -->
                <g id="avatar-collar-sweater" class="avatar-variant avatar-collar">
                  <path
                    fill="var(--avatar-clothes-accent)"
                    d="M140 322c11 26 24 38 40 38s29-12 40-38l22 150h-124z"
                  />
                  <polygon points="180,330 162,320 172,316" fill="var(--avatar-shirt)" />
                  <polygon points="180,330 198,320 188,316" fill="var(--avatar-shirt)" />
                  <path
                    d="M152 326c8 16 18 24 28 24s20-8 28-24"
                    fill="none"
                    stroke="var(--avatar-accent)"
                    stroke-width="3"
                    stroke-linecap="round"
                  />
                </g>

                <!-- Clothes Line Detail -->
                <path
                  class="avatar-clothes-line"
                  fill="none"
                  stroke="var(--avatar-accent)"
                  stroke-linecap="round"
                  stroke-dasharray="8 6"
                  stroke-width="3.5"
                  d="M100 435h160"
                />
              </g>

              <!-- HEAD GROUP (Nodding, Tilting, Expressions) -->
              <g id="avatar-head" class="avatar-head">
                <!-- Hair Back Layers (for bob and wave) -->
                <path
                  id="avatar-hair-bob-back"
                  class="avatar-hair-back avatar-hair-bob-back"
                  fill="var(--avatar-hair)"
                  d="M92 144c-24 50-18 102 12 136 12-32 18-70 24-106zM268 144c24 50 18 102-12 136-12-32-18-70-24-106z"
                />
                <path
                  id="avatar-hair-wave-back"
                  class="avatar-hair-back avatar-hair-wave-back"
                  fill="var(--avatar-hair)"
                  d="M86 144c-28 60-14 116 18 148 10-38 18-80 24-118zM274 144c28 60 14 116-18 148-10-38-18-80-24-118z"
                />

                <!-- Ears -->
                <g class="avatar-ears">
                  <g class="avatar-ear avatar-ear-left">
                    <ellipse cx="88" cy="182" rx="16" ry="24" fill="var(--avatar-skin)" stroke="var(--avatar-skin-shadow)" stroke-width="2.5" />
                    <path d="M86 174c-4 6-2 14 4 16" fill="none" stroke="var(--avatar-skin-shadow)" stroke-width="2" stroke-linecap="round" />
                  </g>
                  <g class="avatar-ear avatar-ear-right">
                    <ellipse cx="272" cy="182" rx="16" ry="24" fill="var(--avatar-skin)" stroke="var(--avatar-skin-shadow)" stroke-width="2.5" />
                    <path d="M274 174c4 6 2 14-4 16" fill="none" stroke="var(--avatar-skin-shadow)" stroke-width="2" stroke-linecap="round" />
                  </g>
                </g>

                <!-- Face Contour (Chibi Sculpted Contour) -->
                <path
                  class="avatar-face"
                  fill="var(--avatar-skin)"
                  stroke="var(--avatar-skin-shadow)"
                  stroke-width="2.5"
                  d="M98 145c-6 58 12 96 46 110 18 8 54 8 72 0 34-14 52-52 46-110-4-58-40-75-82-75s-78 17-82 75z"
                />

                <!-- Soft Cheeks Blush -->
                <ellipse class="avatar-cheek avatar-cheek-left" cx="122" cy="208" rx="18" ry="10" fill="url(#avatar-blush-grad)" />
                <ellipse class="avatar-cheek avatar-cheek-right" cx="238" cy="208" rx="18" ry="10" fill="url(#avatar-blush-grad)" />
                <circle cx="120" cy="206" r="2.2" fill="#ffffff" opacity="0.6" />
                <circle cx="240" cy="206" r="2.2" fill="#ffffff" opacity="0.6" />

                <!-- Nose (Cute Button Nose) -->
                <path
                  class="avatar-nose"
                  d="M178 194c1 3 3 3 4 0"
                  fill="none"
                  stroke="var(--avatar-skin-shadow)"
                  stroke-width="3"
                  stroke-linecap="round"
                />

                <!-- Eyebrows (Dynamic & Expressive) -->
                <g id="avatar-brows" class="avatar-brows">
                  <path
                    class="avatar-brow avatar-brow-left"
                    d="M128 148c8-7 20-7 26-2"
                    fill="none"
                    stroke="var(--avatar-hair)"
                    stroke-width="3.8"
                    stroke-linecap="round"
                  />
                  <path
                    class="avatar-brow avatar-brow-right"
                    d="M206 146c6-5 18-5 26 2"
                    fill="none"
                    stroke="var(--avatar-hair)"
                    stroke-width="3.8"
                    stroke-linecap="round"
                  />
                </g>

                <!-- Eyes (Large Sparkling Eyes) -->
                <g id="avatar-eyes" class="avatar-eyes">
                  <!-- Normal Open Eyes -->
                  <g class="avatar-eyes-open">
                    <!-- Left Eye -->
                    <g class="avatar-eye-group avatar-eye-group-left">
                      <ellipse cx="144" cy="174" rx="14" ry="17" fill="#ffffff" stroke="var(--avatar-skin-shadow)" stroke-width="1.2" />
                      <ellipse class="avatar-eye avatar-eye-left" cx="144" cy="174" rx="11" ry="14" fill="url(#avatar-eye-grad)" />
                      <ellipse cx="144" cy="175" rx="5" ry="7" fill="#0f172a" />
                      <path d="M136 178c3 5 13 5 16 0" fill="none" stroke="var(--avatar-hair-highlight)" stroke-width="2" opacity="0.85" />
                      <circle class="avatar-eye-glint" cx="148" cy="168" r="4.2" fill="#ffffff" />
                      <circle cx="139" cy="179" r="2.2" fill="#ffffff" opacity="0.85" />
                      <path d="M128 170c4-12 26-12 32 0" fill="none" stroke="var(--avatar-hair)" stroke-width="4" stroke-linecap="round" />
                    </g>
                    <!-- Right Eye -->
                    <g class="avatar-eye-group avatar-eye-group-right">
                      <ellipse cx="216" cy="174" rx="14" ry="17" fill="#ffffff" stroke="var(--avatar-skin-shadow)" stroke-width="1.2" />
                      <ellipse class="avatar-eye avatar-eye-right" cx="216" cy="174" rx="11" ry="14" fill="url(#avatar-eye-grad)" />
                      <ellipse cx="216" cy="175" rx="5" ry="7" fill="#0f172a" />
                      <path d="M208 178c3 5 13 5 16 0" fill="none" stroke="var(--avatar-hair-highlight)" stroke-width="2" opacity="0.85" />
                      <circle class="avatar-eye-glint" cx="220" cy="168" r="4.2" fill="#ffffff" />
                      <circle cx="211" cy="179" r="2.2" fill="#ffffff" opacity="0.85" />
                      <path d="M200 170c4-12 26-12 32 0" fill="none" stroke="var(--avatar-hair)" stroke-width="4" stroke-linecap="round" />
                    </g>
                  </g>

                  <!-- Smile Eyes (Happy curved crescents) -->
                  <g class="avatar-eyes-smile">
                    <path d="M128 176c6-9 24-9 30 0" fill="none" stroke="var(--avatar-hair)" stroke-width="4.5" stroke-linecap="round" />
                    <path d="M202 176c6-9 24-9 30 0" fill="none" stroke="var(--avatar-hair)" stroke-width="4.5" stroke-linecap="round" />
                  </g>
                </g>

                <!-- Mouth System (Closed / Speech / Smile) -->
                <g id="avatar-mouth-wrapper" class="avatar-mouth-wrapper">
                  <!-- Closed Mouth Line -->
                  <path
                    class="avatar-mouth-closed"
                    d="M172 226c4 3 12 3 16 0"
                    fill="none"
                    stroke="var(--avatar-skin-shadow)"
                    stroke-width="3"
                    stroke-linecap="round"
                  />
                  <!-- Speaking Mouth (Audio reactive aperture + teeth & tongue) -->
                  <g class="avatar-speaking-mouth-box">
                    <ellipse
                      id="mouth"
                      class="avatar-mouth"
                      cx="180"
                      cy="228"
                      rx="10"
                      ry="2"
                    />
                  </g>
                  <!-- Cheerful Big Smile Mouth -->
                  <path
                    id="smile-mouth"
                    class="avatar-smile-mouth"
                    d="M165 223c4 16 26 16 30 0z"
                  />
                </g>

                <!-- Front Hair Styles -->
                <!-- Hair 1: Midnight (Short Layered Chic Hair) -->
                <g id="avatar-hair-short" class="avatar-variant avatar-hair">
                  <path
                    fill="var(--avatar-hair)"
                    d="M92 148c-10-68 28-98 88-98 62 0 98 32 90 98-18-24-34-36-62-34-22 2-38 18-50 36-18-12-38-12-66-2z"
                  />
                  <path
                    fill="var(--avatar-hair)"
                    d="M90 142c-6 32-2 56 6 68 4-22 8-46 14-64zM270 142c6 32 2 56-6 68-4-22-8-46-14-64z"
                  />
                </g>

                <!-- Hair 2: Coral (Cute Bob + Energetic Ahoge) -->
                <g id="avatar-hair-bob" class="avatar-variant avatar-hair">
                  <path
                    fill="var(--avatar-hair)"
                    d="M88 152c-12-76 30-104 92-104 64 0 102 32 92 104-20-22-38-34-66-32-20 2-36 16-48 34-16-10-38-12-70-2z"
                  />
                  <path
                    fill="var(--avatar-hair)"
                    d="M84 148c-14 46-6 86 16 102 4-28 6-58 10-86zM276 148c14 46 6 86-16 102-4-28-6-58-10-86z"
                  />
                  <!-- Energetic Ahoge (呆毛!) -->
                  <path
                    class="avatar-ahoge"
                    fill="var(--avatar-hair)"
                    d="M178 52c-4-32 24-42 20-52-12 18-4 32-14 52z"
                  />
                </g>

                <!-- Hair 3: Mint (Soft Fluffy Wavy Curls) -->
                <g id="avatar-hair-wave" class="avatar-variant avatar-hair">
                  <path
                    fill="var(--avatar-hair)"
                    d="M90 148c-10-72 32-100 90-100 60 0 100 30 90 100-24-22-44-32-68-30-22 2-38 16-48 32-18-8-38-10-64-2z"
                  />
                  <path
                    fill="var(--avatar-hair)"
                    d="M82 144c-18 42-12 88 14 114 4-24 4-50 8-76 6 22 14 38 22 46-8-28-8-56-6-84z"
                  />
                  <path
                    fill="var(--avatar-hair)"
                    d="M278 144c18 42 12 88-14 114-4-24-4-50-8-76-6 22-14 38-22 46 8-28 8-56 6-84z"
                  />
                </g>

                <!-- Hair Highlight Streak (Luminous Gloss) -->
                <path
                  class="avatar-hair-highlight"
                  fill="none"
                  stroke="var(--avatar-hair-highlight)"
                  stroke-linecap="round"
                  stroke-width="7"
                  opacity="0.85"
                  d="M124 82c20-22 40-28 68-28"
                />

                <!-- Accessories -->
                <!-- Stylish Modern Glasses -->
                <g id="avatar-glasses" class="avatar-variant avatar-glasses">
                  <rect x="114" y="152" width="58" height="46" rx="16" />
                  <rect x="188" y="152" width="58" height="46" rx="16" />
                  <path d="M172 168h16M114 168l-18-6M246 168l18-6" />
                  <path d="M122 160l14-6M196 160l14-6" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" stroke-linecap="round" />
                </g>

                <!-- Golden Sparkling Star Hairpin -->
                <g id="avatar-accessory-star" class="avatar-variant avatar-star">
                  <path
                    fill="var(--avatar-accessory)"
                    d="M268 96l5 13 14 1-11 9 4 14-12-8-12 8 4-14-11-9 14-1z"
                  />
                  <circle cx="268" cy="108" r="3" fill="#ffffff" opacity="0.85" />
                </g>
              </g>
            </svg>
          </div>
        </div>
      </section>

      <section class="control-panel" aria-labelledby="controls-heading">
        <div>
          <p class="eyebrow">文字播报</p>
          <h2 id="controls-heading">让角色说点什么</h2>
        </div>

        <form id="controls" novalidate>
          <div class="field-group">
            <label for="input">播报文本</label>
            <textarea
              id="input"
              name="input"
              rows="6"
              maxlength="600"
              placeholder="输入一段简短文字，例如：你好，欢迎体验卡通数字人。"
              required
            ></textarea>
            <div class="field-meta">
              <span>最多 600 个 Unicode 字符</span>
              <output id="char-count" for="input">0 / 600</output>
            </div>
          </div>

          <div class="field-group">
            <label for="character">角色预设</label>
            <select id="character" name="character" aria-describedby="character-help">
              <option value="">正在加载角色…</option>
            </select>
            <p id="character-help" class="field-help">
              每个角色带有一个期望音色；切换角色不会静默替换你的手动选择。
            </p>
          </div>

          <div class="field-group">
            <label for="voice">音色</label>
            <select id="voice" name="voice" disabled aria-describedby="voice-help">
              <option value="">正在加载音色…</option>
            </select>
            <p id="voice-help" class="field-help">首次打开会从本地 SpeechRail 读取可用音色。</p>
          </div>

          <div class="button-row">
            <button id="speak" type="submit" class="button button-primary" disabled>
              开始播报
            </button>
            <button id="stop" type="button" class="button button-secondary" disabled>
              停止
            </button>
          </div>
          <button id="refresh-voices" type="button" class="button button-link">
            刷新音色
          </button>
        </form>

        <section class="transcript-panel" aria-labelledby="transcript-heading">
          <div class="progress-heading">
            <h3 id="transcript-heading">本次播报</h3>
            <output id="playback-time" for="playback-progress">00:00 / 00:00</output>
          </div>
          <p id="transcript" class="transcript is-empty">播报后会在这里显示完整文本。</p>
          <progress
            id="playback-progress"
            max="1"
            value="0"
            role="progressbar"
            aria-label="播放进度"
            aria-valuemin="0"
            aria-valuemax="1"
            aria-valuenow="0"
          ></progress>
        </section>

        <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
          正在准备音色目录…
        </p>
      </section>
    </main>
  </body>
</html>
