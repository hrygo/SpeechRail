<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="使用 SpeechRail 音色驱动的本地卡通数字人播报示例"
    />
    <title>卡通数字人 · SpeechRail</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/app.mjs"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-panel" aria-labelledby="avatar-heading">
        <p class="eyebrow">SpeechRail 本地示例</p>
        <h1 id="avatar-heading">卡通数字人</h1>
        <p class="intro">
          选择当前可用的 TTS 音色，让小小播报员把文字说出来。
        </p>

        <div class="avatar-stage">
          <div
            id="avatar"
            class="avatar-figure avatar-action-idle"
            data-action="idle"
            role="img"
            aria-labelledby="avatar-title avatar-description"
          >
            <span id="avatar-title" class="visually-hidden">戴眼镜、穿深色西装的卡通播报员</span>
            <span id="avatar-description" class="visually-hidden">
              一个来自自传视频封面图的半身人物，会随播报状态做轻微动作。
            </span>
            <img
              class="avatar-image"
              src="/static/assets/autobiography-character.png"
              alt=""
              aria-hidden="true"
              draggable="false"
            />
          </div>
        </div>
      </section>

      <section class="control-panel" aria-labelledby="controls-heading">
        <div>
          <p class="eyebrow">文字播报</p>
          <h2 id="controls-heading">让角色说点什么</h2>
        </div>

        <form id="controls" novalidate>
          <div class="field-group">
            <label for="input">播报文本</label>
            <textarea
              id="input"
              name="input"
              rows="6"
              maxlength="600"
              placeholder="输入一段简短文字，例如：你好，欢迎体验卡通数字人。"
              required
            ></textarea>
            <div class="field-meta">
              <span>最多 600 个 Unicode 字符</span>
              <output id="char-count" for="input">0 / 600</output>
            </div>
          </div>

          <div class="field-group">
            <label for="voice">音色</label>
            <select id="voice" name="voice" disabled aria-describedby="voice-help">
              <option value="">正在加载音色…</option>
            </select>
            <p id="voice-help" class="field-help">首次打开会从本地 SpeechRail 读取可用音色。</p>
          </div>

          <div class="button-row">
            <button id="speak" type="submit" class="button button-primary" disabled>
              开始播报
            </button>
            <button id="stop" type="button" class="button button-secondary" disabled>
              停止
            </button>
          </div>
          <button id="refresh-voices" type="button" class="button button-link">
            刷新音色
          </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
          正在准备音色目录…
        </p>
      </section>
    </main>
  </body>
</html>
