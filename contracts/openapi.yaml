      description: |
        Runs bounded quality probes against a voice profile and returns a full
        `VoiceQualityReport` summary and persists the output-validation binding
        for clone voices. The legacy route returns the report fields plus
        `validation_persisted`; the namespaced route returns `legacy_report`,
        `evidence` and `validation_persisted`.
