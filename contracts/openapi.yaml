  /v1/jobs:
    post:
      operationId: createSpeechJob
      tags: [jobs]
      summary: Queue an asynchronous speech job
      description: |
        Creates an owner-scoped job record. `input_ref` is an opaque caller
        reference; it must not contain raw audio, transcript text, or credentials.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: Same owner/key/payload replays the original job; a changed payload conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Job accepted for later processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/BackendNotReady'
    get:
      operationId: listSpeechJobs
      tags: [jobs]
      summary: List owner-scoped asynchronous speech jobs
      description: |
        Returns metadata for jobs owned by the authenticated caller, newest
        first. Pagination uses an opaque `cursor`; pass the returned
        `next_cursor` to fetch the following page. Raw audio, transcripts, and
        artifacts are never returned.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of job records to return per page.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor returned as `next_cursor`.
      responses:
        '200':
          description: A page of owner-scoped job metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/jobs/{job_id}:
