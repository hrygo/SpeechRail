openapi: 3.1.0
info:
  title: SpeechRail API
  version: 1.7.0
  description: |
    Local-first shared ASR and TTS service.

    The /v1/audio/transcriptions endpoint follows the OpenAI-compatible
    multipart shape so existing SDK clients can be reused. The realtime
    WebSocket contract is documented in contracts/realtime-openai.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8201
    description: Local development
tags:
  - name: health
    description: Process and model readiness
  - name: models
    description: Exposed model identities
  - name: transcription
    description: OpenAI-compatible audio transcription
  - name: speech
    description: OpenAI-compatible text-to-speech
  - name: jobs
    description: Owner-scoped asynchronous speech job metadata
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check process health
      security: [{}]
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: speechrail
                version: 1.7.0
                backend: asr-1.7b-q8
                profile: quality
                asr_ready: true
                tts_ready: true
                diarization_ready: false
                diarization:
                  configured: false
                  ready: false
                  code: diarization_not_configured
                  message: diarization profile is not configured
                  profile: null
                ready: true
        '400':
          $ref: '#/components/responses/BadRequest'
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Check model readiness
      security: [{}]
      responses:
        '200':
          description: ASR/TTS runtime can accept inference; optional diarization status is informational
          content:
            application/json:
              schema:
                type: object
                required: [ready, diarization]
                properties:
                  ready:
                    type: boolean
                    const: true
                  diarization:
                    $ref: '#/components/schemas/DiarizationStatus'
        '503':
          $ref: '#/components/responses/BackendNotReady'
        '400':
          $ref: '#/components/responses/BadRequest'
  /metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: Expose low-cardinality runtime metrics
      description: |
        Returns metrics in Prometheus text exposition format (default) or a
        structured JSON view when the request Accept header prefers
        `application/json`. Labels are strictly limited to the low-cardinality
        set (`endpoint`, `status`, `class`, `component`, `voice`, `state`,
        `event`, `reason`, `method`); request IDs and transcript content are
        never recorded.
      security: [{}]
      responses:
        '200':
          description: Metrics snapshot in text or JSON form
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/models:
    get:
      operationId: listModels
      tags: [models]
      summary: List canonical model and compatibility aliases
      security: [{}]
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              example:
                object: list
                data:
                  - id: speechrail/qwen3-asr-1.7b
                    object: model
                    owned_by: speechrail
                    created: 0
                  - id: speechrail/qwen3-tts
                    object: model
                    owned_by: speechrail
                    created: 0
                  - id: whisper-1
                    object: model
                    owned_by: speechrail
                    created: 0
                    resolves_to: speechrail/qwen3-asr-1.7b
                  - id: gpt-4o-transcribe
                    object: model
                    owned_by: speechrail
                    created: 0
                    resolves_to: speechrail/qwen3-asr-1.7b
                  - id: tts-1
                    object: model
                    owned_by: speechrail
                    created: 0
                    resolves_to: speechrail/qwen3-tts
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/audio/transcriptions:
    post:
      operationId: createTranscription
      tags: [transcription]
      summary: Transcribe an audio file
      description: |
        Accepts multipart/form-data. The model defaults to
        speechrail/qwen3-asr-1.7b. For realtime audio-buffer commits use the
          WebSocket contract in contracts/realtime-openai.md instead. The file may use
        the OpenAI-compatible audio containers flac, mp3, mp4, mpeg, mpga, m4a,
        ogg, wav, or webm. The multipart Content-Type and filename are format
        hints; the service validates and decodes the uploaded content.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranscriptionRequest'
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TranscriptionResponse'
                  - $ref: '#/components/schemas/VerboseTranscriptionResponse'
            text/plain:
              schema:
                type: string
            text/vtt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/AudioTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QueueFull'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/voices:
    get:
      operationId: listVoices
      tags: [speech]
      summary: List system and custom TTS voices
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Public TTS voice catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createVoice
      tags: [speech]
      summary: Design and register a custom voice using natural language prompt
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceRequest'
      responses:
        '201':
          description: Created custom voice profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/voices/{voice_id}:
    delete:
      operationId: deleteVoice
      tags: [speech]
      summary: Delete a custom voice
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voice deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: System voices are protected and cannot be deleted
        '404':
          description: Voice not found
  /v1/audio/speech:
    post:
      operationId: createSpeech
      tags: [speech]
      summary: Synthesize a sentence as audio
      description: |
        OpenAI-compatible JSON request shape. Responses are returned as mp3
        (default), opus, aac, flac or wav containers; `pcm` streams raw signed
        16-bit little-endian mono samples as they are produced. Clients should
        select a voice with `available=true` from `/v1/voices`; a registered
        voice unsupported by the active TTS weights returns
        `400 voice_not_available` before inference starts.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
      responses:
        '200':
          description: Synthesized audio stream
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/opus:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/x-pcm:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BackendDeliveryInvalid'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/jobs:
    post:
      operationId: createSpeechJob
      tags: [jobs]
      summary: Queue an asynchronous speech job
      description: |
        Creates an owner-scoped job record. `input_ref` is an opaque caller
        reference; it must not contain raw audio, transcript text, or credentials.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Job accepted for later processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^job_[a-f0-9]{32}$'
    get:
      operationId: getSpeechJob
      tags: [jobs]
      summary: Get an asynchronous speech job
      description: Returns metadata only when the caller has the same authenticated owner scope.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Job metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '503':
          $ref: '#/components/responses/BackendNotReady'
    delete:
      operationId: cancelSpeechJob
      tags: [jobs]
      summary: Cancel an asynchronous speech job
      description: Cancels queued work or releases a completed result reference when available.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Current job metadata after the delete operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '503':
          $ref: '#/components/responses/BackendNotReady'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Required when the service is not loopback-only.
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, backend, profile, asr_ready, tts_ready, diarization_ready, diarization, ready]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: speechrail
        version:
          type: string
        backend:
          type: string
          description: Active managed ASR artifact, or the canonical ASR model ID when unmanaged.
          example: asr-1.7b-q8
        profile:
          type: [string, 'null']
          enum: [quality, balanced, light, null]
          description: Active managed profile; null for an unmanaged runtime.
        asr_ready:
          type: boolean
        tts_ready:
          type: boolean
        diarization_ready:
          type: boolean
        diarization:
          $ref: '#/components/schemas/DiarizationStatus'
        ready:
          type: boolean
    DiarizationStatus:
      type: object
      required: [configured, ready, code, message, profile]
      properties:
        configured:
          type: boolean
        ready:
          type: boolean
        code:
          type: [string, 'null']
          description: Stable diagnostic code; null when the profile is ready.
        message:
          type: string
        profile:
          type: [string, 'null']
          enum: [sortformer, camplus, null]
    Model:
      type: object
      required: [id, object, owned_by, created]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        owned_by:
          type: string
          const: speechrail
        created:
          type: integer
          description: >
            Unix timestamp of model registration. Always 0: local snapshots
            carry no creation time (OpenAI SDK clients expect the field).
        resolves_to:
          type: string
          description: |
            Canonical profile this OpenAI-standard alias resolves to. Present
            only on alias entries; canonical entries omit it.
        profile:
          type: [string, 'null']
          enum: [quality, balanced, light, null]
          description: Active managed profile on canonical entries.
        artifact:
          type: string
          description: Immutable managed artifact key on canonical entries.
        source_model:
          type: string
          description: Upstream model identifier recorded in the managed catalog.
        family:
          type: string
          enum: [qwen3_asr, qwen3_tts]
        variant:
          type: string
          enum: [asr, voice_design, custom_voice]
        quantization:
          $ref: '#/components/schemas/Quantization'
    Quantization:
      type: object
      required: [bits, group_size, format]
      properties:
        bits:
          type: [integer, 'null']
        group_size:
          type: [integer, 'null']
        format:
          type: string
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Model'
    VoiceProfile:
      type: object
      required: [id, name, description, instruction, aliases, is_default, is_system, created_at, available, variant, capabilities]
      properties:
        id:
          type: string
          description: System preset or user-created voice identifier.
        name:
          type: string
        description:
          type: string
        instruction:
          type: string
        aliases:
          type: array
          description: OpenAI standard and legacy SpeechRail voice names accepted for this preset.
          items:
            type: string
        is_default:
          type: boolean
        is_system:
          type: boolean
        created_at:
          type: number
        available:
          type: boolean
          description: Whether the active TTS weights can synthesize this voice.
        variant:
          type: [string, 'null']
          enum: [voice_design, custom_voice, null]
        capabilities:
          $ref: '#/components/schemas/VoiceCapabilities'
    VoiceCapabilities:
      type: object
      required: [supports_speaker, supports_instruction]
      properties:
        supports_speaker:
          type: boolean
        supports_instruction:
          type: boolean
    CreateVoiceRequest:
      type: object
      required: [name, instruction]
      properties:
        name:
          type: string
          description: Friendly display name for the voice
        instruction:
          type: string
          description: Natural language prompt describing the voice characteristics
        id:
          type: string
          description: Optional voice identifier. If omitted, auto-generated.
    VoiceList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/VoiceProfile'
    TranscriptionRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        model:
          type: string
          default: speechrail/qwen3-asr-1.7b
        language:
          type: string
          description: BCP-47-style or provider-compatible language hint.
          example: zh
        languages:
          type: array
          items:
            type: string
          description: Multi-language hint list; the first entry is used when language is absent.
        prompt:
          type: string
          maxLength: 2000
          description: Domain vocabulary hint, not an instruction channel.
        response_format:
          type: string
          enum: [json, verbose_json, diarized_json, text, srt, vtt]
          default: json
          description: Use diarized_json with gpt-4o-transcribe-diarize when a diarization profile is available.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Sampling temperature hint; accepted for OpenAI parity.
        timestamp_granularities:
          type: array
          items:
            type: string
            enum: [word, segment]
          description: |
            Legacy non-bracketed multipart field; still supported for compatibility.
            When both this field and timestamp_granularities[] are supplied, their
            values are merged. Only meaningful with response_format=verbose_json.
        'timestamp_granularities[]':
          type: array
          items:
            type: string
            enum: [word, segment]
          description: |
            Standard OpenAI bracketed multipart field. When both this field and
            timestamp_granularities are supplied, their values are merged. Only
            meaningful with response_format=verbose_json.
        stream:
          type: boolean
          default: false
          description: Rejected with stream_unsupported; SpeechRail returns whole bodies.
        chunking_strategy:
          type: string
          description: Rejected with chunking_strategy_unsupported; SpeechRail transcribes whole files.
        include:
          type: array
          items:
            type: string
          description: Accepted and ignored for OpenAI SDK parity.
        keywords:
          type: array
          items:
            type: string
          description: Accepted and ignored for OpenAI SDK parity.
        known_speaker_names:
          type: array
          items:
            type: string
          description: Accepted and ignored for OpenAI SDK parity.
        known_speaker_references:
          type: array
          items:
            type: string
          description: Accepted and ignored for OpenAI SDK parity.
    SpeechRequest:
      type: object
      required: [model, input, voice]
      properties:
        model:
          type: string
          enum: [speechrail/qwen3-tts, tts-1, tts-1-hd, gpt-4o-mini-tts]
          description: Canonical TTS model or an OpenAI-compatible alias.
        input:
          type: string
          minLength: 1
          maxLength: 4096
        voice:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The nine canonical server roles (serena, vivian, uncle_fu, dylan,
            eric, ryan, aiden, ono_anna, sohee) map one-to-one to the nine
            CustomVoice speakers. Legacy SpeechRail names (default, warm,
            bright, calm) and OpenAI standard names (alloy, ash, ballad, cedar,
            coral, echo, fable, marin, nova, onyx, sage, shimmer, verse) remain
            accepted aliases. Active weights and per-voice availability are
            declared by GET /v1/voices.
        response_format:
          type: string
          enum: [mp3, opus, aac, flac, wav, pcm]
          default: mp3
        speed:
          type: number
          minimum: 0.25
          maximum: 4
          default: 1
        language:
          type: string
          minLength: 1
          maxLength: 64
          default: auto
        instructions:
          type: string
          maxLength: 100000
          description: Accepted and ignored for OpenAI SDK parity; Qwen3-TTS has no instruction channel.
        stream_format:
          type: string
          enum: [audio]
          description: Only audio is accepted; other values are rejected with stream_format_unsupported.
    JobCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, input_ref]
      properties:
        kind:
          type: string
          enum: [speech, transcription]
        input_ref:
          type: string
          minLength: 1
          maxLength: 1000
          description: Opaque external input reference; no raw content or credentials.
    Job:
      type: object
      additionalProperties: false
      required: [id, kind, state, error_code, result_ref]
      properties:
        id:
          type: string
          pattern: '^job_[a-f0-9]{32}$'
          readOnly: true
        kind:
          type: string
          enum: [speech, transcription]
        state:
          type: string
          enum: [queued, running, completed, failed, cancelled, expired]
        error_code:
          type: [string, 'null']
          maxLength: 200
        result_ref:
          type: [string, 'null']
          description: Opaque result reference, present only for completed jobs.
    Usage:
      type: object
      required: [type, seconds]
      properties:
        type:
          type: string
          const: duration
        seconds:
          type: number
          minimum: 0
    TranscriptionResponse:
      type: object
      required: [text, usage]
      properties:
        text:
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
    TranscriptSegment:
      type: object
      required: [id, start, end, text]
      properties:
        id:
          type: integer
          minimum: 0
        seek:
          type: [number, "null"]
        tokens:
          type: ["array", "null"]
          items:
            type: integer
        temperature:
          type: [number, "null"]
        avg_logprob:
          type: [number, "null"]
        compression_ratio:
          type: [number, "null"]
        no_speech_prob:
          type: [number, "null"]
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
        text:
          type: string
        speaker:
          type: [string, "null"]
        speakers:
          type: array
          description: Optional anonymous speaker attribution, ordered by confidence.
          items:
            $ref: '#/components/schemas/DiarizationSpeaker'
        speaker_revision:
          type: [integer, "null"]
          minimum: 1
    DiarizationSpeaker:
      type: object
      required: [id, confidence]
      properties:
        id:
          type: string
          pattern: '^spk_[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        confidence:
          type: number
          minimum: 0
          maximum: 1
    TranscriptWord:
      type: object
      required: [word, start, end]
      properties:
        word:
          type: string
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
    VerboseTranscriptionResponse:
      type: object
      required: [task, language, duration, text, usage]
      properties:
        task:
          type: string
          const: transcribe
        language:
          type: string
          description: Lowercased detected language, or empty when undetected.
        duration:
          type: number
          minimum: 0
        text:
          type: string
        segments:
          type: array
          description: Included when segment timestamps are requested; omitted for word-only responses. When no timestamp granularity is requested, both segments and words are returned.
          items:
            $ref: '#/components/schemas/TranscriptSegment'
        words:
          type: array
          description: Included when word timestamps are requested; omitted for segment-only responses. When no timestamp granularity is requested, both segments and words are returned.
          items:
            $ref: '#/components/schemas/TranscriptWord'
        usage:
          $ref: '#/components/schemas/Usage'
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [message, type, code, request_id, retryable]
      properties:
        message:
          type: string
        type:
          type: string
          enum: [invalid_request_error, authentication_error, server_error]
        param:
          type: [string, "null"]
        code:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AudioTooLarge:
      description: Audio exceeds configured limits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: Multipart validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    QueueFull:
      description: Bounded inference queue is full
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BackendNotReady:
      description: Model runtime is not ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BackendDeliveryInvalid:
      description: TTS worker delivered an invalid audio stream
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    JobNotFound:
      description: Job does not exist or is outside the caller owner scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
