openapi: 3.1.0
info:
  title: SpeechRail API
  version: 3.2.1
  description: |
    Local-first shared ASR and TTS service.

    OpenAI-compatible operations remain under /v1/audio/*.
    SpeechRail-only management and strong-consistency extensions use
    /v1/speechrail/* or optional SpeechRail-* request headers.

    Effective capability discovery is a safe, atomic selection surface; it is
    not itself an inference lease. Clients that need cross-request voice
    consistency should copy voice_revision and the selected model's
    catalog_revision into the expected revision headers on /v1/audio/speech.

    The /v1/audio/transcriptions endpoint follows the OpenAI-compatible
    multipart shape so existing SDK clients can be reused. The realtime
    WebSocket contract is documented in contracts/realtime-openai.md and
    mechanically constrained by contracts/realtime-events.schema.json.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8201
    description: Local development
tags:
  - name: health
    description: Process and model readiness
  - name: models
    description: Exposed model identities
  - name: transcription
    description: OpenAI-compatible audio transcription
  - name: speech
    description: OpenAI-compatible text-to-speech
  - name: jobs
    description: Owner-scoped asynchronous speech job metadata
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check process health
      security: [{}]
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: speechrail
                version: 3.2.1
                backend: asr-1.7b-q8
                profile: quality/quality
                asr_ready: true
                asr_runtime_revision: null
                tts_ready: true
                tts_warm: true
                diarization_ready: false
                diarization:
                  configured: false
                  ready: false
                  code: diarization_not_configured
                  message: diarization profile is not configured
                  profile: null
                realtime_vad:
                  configured_engine: auto
                  resolved_engine: silero
                  speech_admission_enabled: true
                  ready: true
                  code: null
                  message: Silero VAD runtime and model are ready
                asr_state: active
                tts_state: active
                streaming_state: active
                ready: true
                job_spool_ready: false
        '400':
          $ref: '#/components/responses/BadRequest'
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Check model readiness
      security: [{}]
      responses:
        '200':
          description: ASR/TTS runtime can accept inference; diarization and realtime VAD statuses are informational capability diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [ready, diarization, realtime_vad]
                properties:
                  ready:
                    type: boolean
                    const: true
                  diarization:
                    $ref: '#/components/schemas/DiarizationStatus'
                  realtime_vad:
                    $ref: '#/components/schemas/RealtimeVADStatus'
        '503':
          $ref: '#/components/responses/BackendNotReady'
        '400':
          $ref: '#/components/responses/BadRequest'
  /metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: Expose low-cardinality runtime metrics
      description: |
        Returns metrics in Prometheus text exposition format (default) or a
        structured JSON view when the request Accept header prefers
        `application/json`. The JSON view also includes optional runtime
        resource observations and scheduling policy facts. Labels are strictly limited to the low-cardinality
        set (`endpoint`, `status`, `class`, `component`, `voice_class`, `state`,
        `event`, `reason`, `method`); request IDs and transcript content are
        never recorded. In the JSON `histograms` map, the named
        `speechrail_asr_rtf` series is ASR inference duration divided by the
        processed audio duration, and `speechrail_tts_rtf` is TTS inference
        duration divided by generated audio duration. RTF is only emitted
        when its denominator is positive; missing series mean that no valid
        observation was recorded, not zero. Realtime streaming latency is
        not renamed or converted to RTF.
      security: [{}]
      responses:
        '200':
          description: Metrics snapshot in text or JSON form
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeMetrics'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/models:
    get:
      operationId: listModels
      tags: [models]
      summary: List canonical model and compatibility aliases
      security: [{}]
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              example:
                object: list
                data:
                  - id: speechrail/qwen3-asr-1.7b
                    object: model
                    owned_by: speechrail
                    created: 0
                  - id: speechrail/qwen3-tts
                    object: model
                    owned_by: speechrail
                    created: 0
                  - id: whisper-1
                    object: model
                    owned_by: speechrail
                    created: 0
                    resolves_to: speechrail/qwen3-asr-1.7b
                  - id: gpt-4o-transcribe
                    object: model
                    owned_by: speechrail
                    created: 0
                    resolves_to: speechrail/qwen3-asr-1.7b
                  - id: tts-1
                    object: model
                    owned_by: speechrail
                    created: 0
                    resolves_to: speechrail/qwen3-tts
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/audio/transcriptions:
    post:
      operationId: createTranscription
      tags: [transcription]
      summary: Transcribe an audio file
      description: |
        Accepts multipart/form-data. The model defaults to
        speechrail/qwen3-asr-1.7b. For realtime audio-buffer commits use the
          WebSocket contract in contracts/realtime-openai.md instead. The file may use
        the OpenAI-compatible audio containers flac, mp3, mp4, mpeg, mpga, m4a,
        ogg, wav, or webm. The multipart Content-Type and filename are format
        hints; the service validates and decodes the uploaded content. A worker
        lifecycle failure after admission returns 503 with the compatible
        `backend_busy` code and low-cardinality `SpeechRail-Busy-Reason` /
        `SpeechRail-Retry-Hint` headers; private worker stderr is never returned.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranscriptionRequest'
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TranscriptionResponse'
                  - $ref: '#/components/schemas/VerboseTranscriptionResponse'
                  - $ref: '#/components/schemas/DiarizedTranscriptionResponse'
            text/event-stream:
              schema:
                type: string
                description: Available only for diarized_json with stream=true.
            text/plain:
              schema:
                type: string
            text/vtt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/AudioTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QueueFull'
        '503':
          description: Model runtime is not ready or a worker is recovering
          headers:
            SpeechRail-Busy-Reason:
              schema:
                type: string
                enum: [backend_unavailable]
              description: Present for a worker lifecycle failure.
            SpeechRail-Retry-Hint:
              schema:
                type: string
                enum: [retry_after_worker_recovery]
              description: Present for a worker lifecycle failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/voices:
    get:
      operationId: listVoices
      tags: [speech]
      summary: List system and custom TTS voices
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Public TTS voice catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
    post:
      operationId: createVoice
      tags: [speech]
      summary: Design and register a custom voice using natural language prompt
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceRequest'
      responses:
        '201':
          description: Created custom voice profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
  /v1/voice-designs:
    post:
      operationId: createVoiceDesignCandidate
      tags: [speech]
      summary: Generate a private VoiceDesign candidate reference
      description: |
        Creates a durable, private design candidate when the active selection
        resolves the VoiceDesign role (currently the reference spec) and local
        Batch ASR. VoiceDesign generates a 2-30 second reference which is
        canonicalized and graded, then transcribed for a reference self-check.
        The expected text is never supplied as an ASR prompt.

        The candidate is never registered as a routable voice. Confirmation,
        Base re-validation with a different test text, an explicit human
        audition and publication are separate calls. Existing voice IDs,
        aliases and system voices cannot be reserved or overwritten. Only
        language=zh is accepted.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: >-
            Optional durable idempotency key. A matching retry replays the
            original candidate, including across process restarts, without
            regenerating audio; a different payload under the same key is
            rejected with idempotency_conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceDesignCandidateRequest'
      responses:
        '201':
          description: New private candidate; no voice was registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignCandidateEnvelope'
        '200':
          description: Idempotent replay of an existing candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignCandidateEnvelope'
        '400':
          description: >-
            Invalid request; includes the stable code voice_design_unsupported
            when the active selection does not provide the VoiceDesign role, or
            voice_quality_reject when the generated reference fails the gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            Target ID already exists or is reserved by another candidate, or
            the idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QueueFull'
        '502':
          $ref: '#/components/responses/BackendDeliveryInvalid'
        '503':
          $ref: '#/components/responses/BackendNotReady'
    get:
      operationId: listVoiceDesignCandidates
      tags: [speech]
      summary: List private VoiceDesign candidates
      description: >-
        Safe candidate metadata only. Reference text, reference text hashes and
        private filesystem paths are never exposed.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Candidates, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignCandidateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
  /v1/voice-designs/{candidate_id}:
    parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^vd_[0-9a-f]{24}$'
        description: Candidate identifier returned by the create call.
    get:
      operationId: getVoiceDesignCandidate
      tags: [speech]
      summary: Read one private VoiceDesign candidate
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Safe candidate metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignCandidateEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
  /v1/voice-designs/{candidate_id}/confirm:
    parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^vd_[0-9a-f]{24}$'
    post:
      operationId: confirmVoiceDesignCandidate
      tags: [speech]
      summary: Confirm the candidate reference transcript
      description: |
        Fixes the candidate and its transcript revision. The stored reference
        audio is re-transcribed and must match the (optionally edited) reference
        text; a mismatch returns transcript_mismatch and nothing is confirmed.

        Editing the reference text produces a new candidate revision and clears
        every earlier validation: text may never be changed while reusing old
        evidence.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceDesignConfirmRequest'
      responses:
        '200':
          description: Confirmed candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignCandidateEnvelope'
        '400':
          description: Stable code transcript_mismatch when the transcript does not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Candidate state or revision changed while confirming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QueueFull'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/voice-designs/{candidate_id}/validate:
    parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^vd_[0-9a-f]{24}$'
    post:
      operationId: validateVoiceDesignCandidate
      tags: [speech]
      summary: Re-create the candidate with Base, or record a human audition
      description: |
        Two mutually exclusive modes.

        Machine mode (`test_text`) synthesizes brand-new text through the Base
        role with the private candidate reference and adds acoustic, transcript
        and runtime-identity evidence. The test text must differ from the
        reference text; when it is omitted the server substitutes a controlled
        test text. Machine metrics never mark identity or naturalness as
        reviewed.

        Human mode (`human_review`) attaches an explicit audition verdict to an
        existing machine result. It is refused unless that result already passed
        the machine gate for the current candidate revision.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceDesignValidateRequest'
      responses:
        '200':
          description: Candidate with the new validation evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignCandidateEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Candidate state/revision conflict, or a human review without a
            passing machine validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: >-
            Invalid request; includes test_text_matches_reference when the test
            text is not distinct from the reference text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          $ref: '#/components/responses/QueueFull'
        '502':
          $ref: '#/components/responses/BackendDeliveryInvalid'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/voice-designs/{candidate_id}/publish:
    parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^vd_[0-9a-f]{24}$'
    post:
      operationId: publishVoiceDesignCandidate
      tags: [speech]
      summary: Publish a validated candidate as an immutable voice revision
      description: |
        Requires a confirmed reference plus at least one complete pass for the
        current candidate revision: machine acoustic/transcript/runtime gate and
        an explicit human identity and naturalness pass.

        Publication is create-only inside the voice store lock. A duplicate
        publish of the same candidate returns the existing voice, and a target
        ID that changed underneath the candidate is refused with a stable
        conflict instead of being overwritten.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceDesignPublishRequest'
      responses:
        '201':
          description: Published voice revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignPublishResponse'
        '200':
          description: The candidate was already published; no second revision was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignPublishResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Stable codes voice_design_validation_required,
            voice_design_state_conflict, voice_design_revision_conflict or
            voice_design_publish_conflict; the private candidate is preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
  /v1/voice-designs/{candidate_id}/cancel:
    parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^vd_[0-9a-f]{24}$'
    post:
      operationId: cancelVoiceDesignCandidate
      tags: [speech]
      summary: Cancel a private candidate that has not been published
      description: >-
        Marks the candidate cancelled. Reference assets are retained for audit,
        the target ID becomes available again, and already published voices are
        never affected.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Cancelled candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDesignCandidateEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A published candidate cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
  /v1/voices/clone/prompts:
    get:
      operationId: listClonePrompts
      tags: [speech]
      summary: List official curated scripts for zero-shot voice cloning
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: List of curated teleprompter prompts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClonePromptList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/voices/clone:
    post:
      operationId: cloneVoice
      tags: [speech]
      summary: Clone and register a voice from reference audio and script text
      description: |
        Clones a voice profile from reference audio and text, runs quality gates,
        and registers the cloned profile. If quality status is `warn`, the voice
        is created and returned with `quality.status=warn`. If quality status is
        `reject`, the request is rejected with a stable `voice_quality_reject`
        error.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional idempotency key to deduplicate retry attempts.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceCloneRequest'
      responses:
        '201':
          description: Created cloned voice profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/AudioTooLarge'
        '500':
          $ref: '#/components/responses/DependencyMissing'
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
  /v1/voices/clone/validate:
    post:
      operationId: validateVoiceClone
      tags: [speech]
      summary: Validate clone input quality without creating a profile
      description: |
        Validates voice clone inputs with the same pipeline as `POST /v1/voices/clone`
        and returns `VoiceQualityReport` without creating or persisting a
        `VoiceProfile`.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceCloneRequest'
      responses:
        '200':
          description: Quality report for clone validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceQualityReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/AudioTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/DependencyMissing'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/voices/previews:
    post:
      operationId: createVoicePreview
      tags: [speech]
      summary: Generate an ephemeral VoiceDesign preview
      description: |
        Generates a short-lived audio preview from a natural-language voice
        instruction. The request does not create or persist a VoiceProfile or
        reference audio. This endpoint is available only when the active TTS
        artifact has variant=voice_design. Availability follows the active
        runtime capability and is not tied to a profile name.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoicePreviewRequest'
      responses:
        '200':
          description: Ephemeral synthesized audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/opus:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/x-pcm:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QueueFull'
        '502':
          $ref: '#/components/responses/BackendDeliveryInvalid'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/voices/{voice_id}:
    get:
      operationId: getVoice
      tags: [speech]
      summary: Get one TTS voice profile
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voice profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Voice not found
        '503':
          $ref: '#/components/responses/VoiceStoreUnavailable'
    patch:
      operationId: updateVoice
      tags: [speech]
      summary: Update mutable metadata for a custom voice
      description: >-
        Updates name for any custom voice. Natural-language instruction and
        seed are mutable only for instruction-mode voices; clone reference
        audio, provenance, ref_text, and voice ID remain immutable.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVoiceRequest'
      responses:
        '200':
          description: Updated voice profile
          content:
            application/json:
              schema:
