              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/audio/speech:
    post:
      operationId: createSpeech
      tags: [speech]
      summary: Synthesize a sentence as audio
      description: |
        OpenAI-compatible JSON request shape. Optional SpeechRail-* headers add
        local revision pinning, pronunciation, and integrity receipts without
        changing the OpenAI request body. Responses are returned as mp3
        (default), opus, aac, flac or wav containers; `pcm` streams raw signed
        16-bit little-endian mono samples as they are produced. Clients should
        select a voice with `available=true` from `/v1/voices`; a registered
        voice unsupported by the active TTS weights returns
        `400 voice_not_available` before inference starts. A corrupt or
        unreadable custom voice registry returns `503 voice_store_unavailable`;
        system voices remain available. A known worker lifecycle failure after
        admission returns `503 backend_busy` with bounded
        `SpeechRail-Busy-Reason` / `SpeechRail-Retry-Hint` headers; private
        worker stderr is never returned.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: header
          name: SpeechRail-Expected-Voice-Revision
          required: false
          schema:
            type: string
            pattern: '^vr_[0-9a-f]{32}$'
          description: Optional SpeechRail acoustic voice revision pin.
        - in: header
          name: SpeechRail-Expected-Model-Revision
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{40}$'
          description: |
            Optional SpeechRail model artifact revision pin. The request is rejected
            with `409 model_revision_conflict` before synthesis when the active TTS
            artifact is unknown or has a different catalog revision.
        - in: header
          name: SpeechRail-Pronunciation-Set
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,64}@pr_[0-9a-f]{32}$'
          description: Optional SpeechRail immutable pronunciation-set revision.
        - in: header
          name: SpeechRail-Receipt-Mode
          required: false
          schema:
            type: string
            enum: [integrity]
          description: Request a SpeechRail service-side integrity receipt.
        - in: header
          name: SpeechRail-Timing-Mode
          required: false
          schema:
            type: string
            enum: [chunk]
          description: |
            Request a SpeechRail metadata-only chunk timing sidecar. This does
            not change the OpenAI request body or delay first PCM. The sidecar
            becomes terminal only after complete synthesis.
        - in: header
          name: SpeechRail-Purpose
          required: false
          schema:
            type: string
            enum: [interactive, prefetch]
          description: |
            Optional bounded admission intent. interactive maps to the existing
            realtime TTS reservation class; prefetch remains batch. Omission
            preserves the historical OpenAI-compatible batch admission behavior.
        - in: header
          name: SpeechRail-Latency-Budget-Ms
          required: false
          schema:
            type: integer
            minimum: 50
            maximum: 120000
          description: |
            Relative service budget in milliseconds, capped by the configured
            server request timeout. It is not a client-supplied absolute deadline
            and cannot create an arbitrary priority class.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
      responses:
        '200':
          description: Synthesized audio stream
          headers:
            SpeechRail-Receipt-Id:
              schema:
                type: string
                pattern: '^rr_[0-9a-f]{32}$'
              description: Present only when SpeechRail-Receipt-Mode=integrity.
            SpeechRail-Timing-Id:
              schema:
                type: string
                pattern: '^tm_[0-9a-f]{32}$'
              description: Present when SpeechRail-Timing-Mode=chunk and the bounded timing registry accepted the request.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/opus:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/x-pcm:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A requested SpeechRail immutable revision is stale or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QueueFull'
        '502':
          $ref: '#/components/responses/BackendDeliveryInvalid'
        '503':
          description: Model runtime or custom voice storage is unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Present for retryable worker lifecycle failures.
            SpeechRail-Busy-Reason:
              schema:
                type: string
                enum: [backend_unavailable]
              description: Present when the inference worker is unavailable.
            SpeechRail-Retry-Hint:
              schema:
                type: string
                enum: [retry_after_worker_recovery]
              description: Present when the inference worker is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
