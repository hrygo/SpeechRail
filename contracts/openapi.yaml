openapi: 3.1.0
info:
  title: SpeechRail API
  version: 0.1.0
  description: |
    Local-first shared ASR and TTS service.

    The /v1/audio/transcriptions endpoint follows the OpenAI-compatible
    multipart shape so existing SDK clients can be reused. The realtime
    WebSocket contract is documented in contracts/realtime-v2.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8201
    description: Local development
  - url: http://127.0.0.1:8001
    description: Migration cutover compatibility port
tags:
  - name: health
    description: Process and model readiness
  - name: models
    description: Exposed model identities
  - name: transcription
    description: OpenAI-compatible audio transcription
  - name: speech
    description: OpenAI-compatible text-to-speech
  - name: jobs
    description: Owner-scoped asynchronous speech job metadata
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check process health
      security: [{}]
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: speechrail
                version: 0.1.0
                backend: qwen3-asr-1.7b
                asr_ready: true
                tts_ready: true
                ready: true
        '400':
          $ref: '#/components/responses/BadRequest'
  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Check model readiness
      security: [{}]
      responses:
        '200':
          description: Model runtime can accept inference
          content:
            application/json:
              schema:
                type: object
                required: [ready]
                properties:
                  ready:
                    type: boolean
                    const: true
        '503':
          $ref: '#/components/responses/BackendNotReady'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/models:
    get:
      operationId: listModels
      tags: [models]
      summary: List canonical model and compatibility aliases
      security: [{}]
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              example:
                object: list
                data:
                  - id: speechrail/qwen3-asr-1.7b
                    object: model
                    owned_by: speechrail
                  - id: Qwen3-ASR-1.7B
                    object: model
                    owned_by: speechrail
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/audio/transcriptions:
    post:
      operationId: createTranscription
      tags: [transcription]
      summary: Transcribe an audio file
      description: |
        Accepts multipart/form-data. The model defaults to
        speechrail/qwen3-asr-1.7b. For realtime audio-buffer commits use the
        WebSocket contract in contracts/realtime.md instead. The file may use
        the OpenAI-compatible audio containers flac, mp3, mp4, mpeg, mpga, m4a,
        ogg, wav, or webm. The multipart Content-Type and filename are format
        hints; the service validates and decodes the uploaded content.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranscriptionRequest'
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TranscriptionResponse'
                  - $ref: '#/components/schemas/VerboseTranscriptionResponse'
            text/plain:
              schema:
                type: string
            text/vtt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/AudioTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QueueFull'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/voices:
    get:
      operationId: listVoices
      tags: [speech]
      summary: List server-owned TTS preset voices
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Public TTS voice catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/audio/speech:
    post:
      operationId: createSpeech
      tags: [speech]
      summary: Synthesize a sentence as audio
      description: |
        OpenAI-compatible JSON request shape. The initial runtime supports WAV
        and signed 16-bit little-endian PCM streaming responses.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
      responses:
        '200':
          description: Synthesized audio stream
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/x-pcm:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/jobs:
    post:
      operationId: createSpeechJob
      tags: [jobs]
      summary: Queue an asynchronous speech job
      description: |
        Creates an owner-scoped job record. `input_ref` is an opaque caller
        reference; it must not contain raw audio, transcript text, or credentials.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Job accepted for later processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/BackendNotReady'
  /v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^job_[a-f0-9]{32}$'
    get:
      operationId: getSpeechJob
      tags: [jobs]
      summary: Get an asynchronous speech job
      description: Returns metadata only when the caller has the same authenticated owner scope.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Job metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '503':
          $ref: '#/components/responses/BackendNotReady'
    delete:
      operationId: cancelSpeechJob
      tags: [jobs]
      summary: Cancel an asynchronous speech job
      description: Cancels queued work or releases a completed result reference when available.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Current job metadata after the delete operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '503':
          $ref: '#/components/responses/BackendNotReady'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Required when the service is not loopback-only.
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, backend, asr_ready, tts_ready, ready]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: speechrail
        version:
          type: string
        backend:
          type: string
          example: qwen3-asr-1.7b
        asr_ready:
          type: boolean
        tts_ready:
          type: boolean
        ready:
          type: boolean
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        owned_by:
          type: string
          const: speechrail
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Model'
    VoiceProfile:
      type: object
      required: [id, description, is_default, available]
      properties:
        id:
          type: string
          enum: [default, warm, bright, calm]
        description:
          type: string
        is_default:
          type: boolean
        available:
          type: boolean
    VoiceList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/VoiceProfile'
    TranscriptionRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        model:
          type: string
          default: speechrail/qwen3-asr-1.7b
        language:
          type: string
          description: BCP-47-style or provider-compatible language hint.
          example: zh
        prompt:
          type: string
          maxLength: 2000
          description: Domain vocabulary hint, not an instruction channel.
        response_format:
          type: string
          enum: [json, verbose_json, text, srt, vtt]
          default: json
    SpeechRequest:
      type: object
      required: [model, input, voice]
      properties:
        model:
          type: string
          const: speechrail/qwen3-tts
        input:
          type: string
          minLength: 1
          maxLength: 100000
        voice:
          type: string
          minLength: 1
          maxLength: 200
        response_format:
          type: string
          enum: [pcm, wav]
          default: wav
        speed:
          type: number
          minimum: 0.25
          maximum: 4
          default: 1
        language:
          type: string
          minLength: 1
          maxLength: 64
          default: auto
    JobCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, input_ref]
      properties:
        kind:
          type: string
          enum: [speech, transcription]
        input_ref:
          type: string
          minLength: 1
          maxLength: 1000
          description: Opaque external input reference; no raw content or credentials.
    Job:
      type: object
      additionalProperties: false
      required: [id, kind, state, error_code, result_ref]
      properties:
        id:
          type: string
          pattern: '^job_[a-f0-9]{32}$'
          readOnly: true
        kind:
          type: string
          enum: [speech, transcription]
        state:
          type: string
          enum: [queued, running, completed, failed, cancelled, expired]
        error_code:
          type: [string, 'null']
          maxLength: 200
        result_ref:
          type: [string, 'null']
          description: Opaque result reference, present only for completed jobs.
    Usage:
      type: object
      required: [type, seconds]
      properties:
        type:
          type: string
          const: duration
        seconds:
          type: number
          minimum: 0
    TranscriptionResponse:
      type: object
      required: [text, usage]
      properties:
        text:
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
    TranscriptSegment:
      type: object
      required: [id, start, end, text]
      properties:
        id:
          type: string
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
        text:
          type: string
        speaker:
          type: [string, "null"]
        speakers:
          type: array
          description: Optional anonymous speaker attribution, ordered by confidence.
          items:
            $ref: '#/components/schemas/DiarizationSpeaker'
        speaker_revision:
          type: [integer, "null"]
          minimum: 1
    DiarizationSpeaker:
      type: object
      required: [id, confidence]
      properties:
        id:
          type: string
          pattern: '^spk_[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        confidence:
          type: number
          minimum: 0
          maximum: 1
    TranscriptWord:
      type: object
      required: [word, start, end]
      properties:
        word:
          type: string
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
    VerboseTranscriptionResponse:
      type: object
      required: [task, language, duration, text, segments, words, usage]
      properties:
        task:
          type: string
          const: transcribe
        language:
          type: string
        duration:
          type: number
          minimum: 0
        text:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptSegment'
        words:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptWord'
        usage:
          $ref: '#/components/schemas/Usage'
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [message, type, code, request_id, retryable]
      properties:
        message:
          type: string
        type:
          type: string
          enum: [invalid_request_error, authentication_error, server_error]
        param:
          type: [string, "null"]
        code:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AudioTooLarge:
      description: Audio exceeds configured limits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: Multipart validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    QueueFull:
      description: Bounded inference queue is full
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BackendNotReady:
      description: Model runtime is not ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    JobNotFound:
      description: Job does not exist or is outside the caller owner scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
